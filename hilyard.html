OX.imageSmoothingEnabled=false;
function resize(){
  const wr=window.innerWidth, wh=window.innerHeight-C.parentElement.offsetTop-4;
  const scale=Math.min(wr/RW, wh/RH);
  C.style.width=Math.floor(RW*scale)+'px';
  C.style.height=Math.floor(RH*scale)+'px';
}
resize();
window.addEventListener('resize',resize);

// ── WALL TEXTURES — 128×128 pixel bitmaps sampled per-column ─────
// Each texture is drawn once at startup into an offscreen canvas,
// then read back as an ImageData for fast pixel lookup.
const TEX_SIZE=128;
function mkTex(drawFn){
  const oc=document.createElement('canvas'); oc.width=oc.height=TEX_SIZE;
  const ox=oc.getContext('2d'); drawFn(ox,TEX_SIZE);
  return ox.getImageData(0,0,TEX_SIZE,TEX_SIZE).data; // Uint8ClampedArray RGBA
}

// Seeded noise helper — deterministic per pixel
function snoise(x,y,seed){ return (((x*1619+y*31337+seed*6971)^(x>>3)^(y<<4))&0xffffff)/0xffffff; }
function fbm(x,y,seed,oct){
  let v=0,a=0.5,f=1;
  for(let i=0;i<oct;i++){v+=a*snoise(Math.floor(x*f),Math.floor(y*f),seed+i*77);a*=0.5;f*=2.1;}
  return v;
}

// ── Texture 1: HOSPITAL TILE (type 6 — OR white) ─────────────────
const TEX_OR=mkTex((ox,SZ)=>{
  const id=ox.createImageData(SZ,SZ); const d=id.data;
  const TW=16,TH=16; // tile cell size in pixels
  for(let y=0;y<SZ;y++) for(let x=0;x<SZ;x++){
    const i=(y*SZ+x)*4;
    const tx=x%TW, ty=y%TH;
    const tc=Math.floor(x/TW),tr=Math.floor(y/TH);
    // Grout lines — dark grey, 1-2 px
    const isGrout=tx<2||ty<2||tx>=TW-1||ty>=TH-1;
    // Per-tile stain strength
    const stain=snoise(tc,tr,42);
    const crack=snoise(tc,tr,77);
    // Damage zone covering ~45% of tiles
    const damaged=stain<0.45;
    // Sub-tile rust/mold detail
    const noise1=fbm(x/4,y/4,13,3);
    const noise2=fbm(x/6,y/6,29,2);
    let r,g,b;
    if(isGrout){
      // Grout — stained dark grey-brown
      const gv=0.25+noise1*0.12;
      r=Math.floor(60*gv); g=Math.floor(55*gv); b=Math.floor(48*gv);
    } else if(damaged){
      // Large decay area — brown rust, dark mould, peeling
      const dv=0.3+noise1*0.45+noise2*0.25;
      const mode=(((tc*7+tr*13)^(tc>>1))%4);
      if(mode<2){r=Math.floor((110+noise2*60)*dv); g=Math.floor((80+noise2*30)*dv); b=Math.floor((50+noise2*20)*dv);}
      else       {r=Math.floor((60+noise2*40)*dv);  g=Math.floor((65+noise2*30)*dv); b=Math.floor((50+noise2*25)*dv);}
    } else {
      // Intact tile — dirty cream-white, slight sheen near top
      const base=0.68+noise1*0.18+noise2*0.08;
      const sheenFrac=ty/TH; // 0=top bright, 1=bottom dark
      const sheen=1.0-sheenFrac*0.30;
      r=Math.floor(Math.min(255,200*base*sheen));
      g=Math.floor(Math.min(255,190*base*sheen));
      b=Math.floor(Math.min(255,165*base*sheen));
      // Blood micro-stains on some intact tiles
      if(crack>0.82){r=Math.min(255,r+Math.floor(40*noise2));g=Math.floor(g*0.7);b=Math.floor(b*0.7);}
    }
    d[i]=r; d[i+1]=g; d[i+2]=b; d[i+3]=255;
  }
  ox.putImageData(id,0,0);
});

// Fast texture sampler — bilinear for close walls, nearest for far
function sampleTex(tex,u,v){
  const tx=Math.min(TEX_SIZE-1,Math.max(0,Math.floor(u*(TEX_SIZE-1))));
  const ty=Math.min(TEX_SIZE-1,Math.max(0,Math.floor(v*(TEX_SIZE-1))));
  const idx=(ty*TEX_SIZE+tx)*4;
  return [tex[idx],tex[idx+1],tex[idx+2]];
}

// ── Raycaster ─────────────────────────────────────────────────
// Returns array of {dist, wallType, side, wallX} per column
function castRays(){
  const results=[];
  for(let col=0;col<RAYS;col++){
    const rayAngle=player.angle - HALF_FOV + (col/RAYS)*FOV;
    const rdx=Math.cos(rayAngle), rdy=Math.sin(rayAngle);
    let mapX=Math.floor(player.x), mapY=Math.floor(player.y);
    // DDA
    const deltaX=Math.abs(1/rdx)||1e30, deltaY=Math.abs(1/rdy)||1e30;
    let stepX,stepY,sideDistX,sideDistY;
    if(rdx<0){stepX=-1;sideDistX=(player.x-mapX)*deltaX;}
    else{stepX=1;sideDistX=(mapX+1-player.x)*deltaX;}
    if(rdy<0){stepY=-1;sideDistY=(player.y-mapY)*deltaY;}
    else{stepY=1;sideDistY=(mapY+1-player.y)*deltaY;}
    let hit=false,side=0,wallType=1;
    for(let i=0;i<64&&!hit;i++){
      if(sideDistX<sideDistY){sideDistX+=deltaX;mapX+=stepX;side=0;}
      else{sideDistY+=deltaY;mapY+=stepY;side=1;}
      const c=mapAt(mapX,mapY);
      if(c===1||c===2||c===3||c===6||c===7||c===8){hit=true;wallType=c;}
    }
    let dist;
    if(side===0) dist=sideDistX-deltaX;
    else         dist=sideDistY-deltaY;
    // Wall X coordinate (for texture variation)
    let wallX;
    if(side===0) wallX=(player.y+dist*rdy)-Math.floor(player.y+dist*rdy);
    else         wallX=(player.x+dist*rdx)-Math.floor(player.x+dist*rdx);
    results.push({dist:Math.max(0.01,dist),wallType,side,wallX});
  }
  return results;
}

// ── Sprite projection ─────────────────────────────────────────
function projectSprite(sx,sy){
  const dx=sx-player.x, dy=sy-player.y;
  const spriteDist=Math.hypot(dx,dy);
  const spriteAngle=Math.atan2(dy,dx)-player.angle;
  let a=spriteAngle;
  while(a>Math.PI)a-=Math.PI*2;
  while(a<-Math.PI)a+=Math.PI*2;
  if(Math.abs(a)>HALF_FOV*1.5)return null;
  const screenX=Math.floor((0.5+a/FOV)*RW);  // full-res screen X
  const h=Math.floor(RH/spriteDist);           // height in full-res pixels
  return{screenX,dist:spriteDist,h,a};
}

function canvasPos(touch){
  const rect=C.getBoundingClientRect();
  const scale=RW/rect.width;
  return{x:(touch.clientX-rect.left)*scale, y:(touch.clientY-rect.top)*scale};
}

C.addEventListener('touchstart',e=>{
  e.preventDefault();
  // If 2+ fingers — user is pinching/zooming, never start game or move
  if(e.touches.length>=2)return;
  if(state===S.TITLE||state===S.DEAD||state===S.WIN){startGame();return;}
  if(state===S.INTRO){state=S.PLAY;return;}
  if(state!==S.PLAY)return;
  for(const t of e.changedTouches){
    const p=canvasPos(t);
    const side=p.x<RW/2?'left':'right';
    touches[t.identifier]={...p,sx:p.x,sy:p.y,side};
    if(side==='left'){joystick={active:true,sx:p.x,sy:p.y,cx:p.x,cy:p.y};}
    else{atkBtn.active=true;}
  }
},{passive:false});

C.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length>=2)return; // ignore pinch moves
  for(const t of e.changedTouches){
    const p=canvasPos(t);
    const td=touches[t.identifier];
    if(!td)continue;
    td.cx=p.x;td.cy=p.y;
    if(td.side==='left'){joystick.cx=p.x;joystick.cy=p.y;}
  }
},{passive:false});

C.addEventListener('touchend',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const td=touches[t.identifier];
    if(!td)continue;
    if(td.side==='right'){
      doAttack();
      atkBtn.active=false;
    }
    if(td.side==='left'){joystick.active=false;}
    delete touches[t.identifier];
  }
},{passive:false});

// ── Audio engine ─────────────────────────────────────────────
let audioCtx=null, masterGain=null;
let droneNode=null, droneGain=null;
let dripTimer=0, groanTimer=0;

function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=0.7;
  masterGain.connect(audioCtx.destination);
  startDrone();
}

// Deep rumbling ambient drone — layered detuned oscillators through heavy lowpass
function startDrone(){
  if(!audioCtx||droneNode)return;
  const gain=audioCtx.createGain();
  gain.gain.setValueAtTime(0,audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.08,audioCtx.currentTime+3);
  gain.connect(masterGain);
  droneGain=gain;

  // Two detuned subs for that low rumble
  [38,41].forEach((freq,i)=>{
    const osc=audioCtx.createOscillator();
    const lp=audioCtx.createBiquadFilter();
    lp.type='lowpass'; lp.frequency.value=90; lp.Q.value=0.5;
    osc.type='sawtooth';
    osc.frequency.value=freq;
    // Slow LFO wobble
    const lfo=audioCtx.createOscillator();
    const lfoGain=audioCtx.createGain();
    lfo.frequency.value=0.07+i*0.03;
    lfoGain.gain.value=1.2;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    lfo.start();
    osc.connect(lp); lp.connect(gain);
    osc.start();
  });

  // High faint hiss — distant ventilation
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.15;
  const src=audioCtx.createBufferSource();
  src.buffer=buf; src.loop=true;
  const hp=audioCtx.createBiquadFilter();
  hp.type='bandpass'; hp.frequency.value=1800; hp.Q.value=0.4;
  const hg=audioCtx.createGain(); hg.gain.value=0.06;
  src.connect(hp); hp.connect(hg); hg.connect(masterGain);
  src.start();
}

// Single water drip — synthesised from pitched noise burst + reverb tail
function playDrip(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.18,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  // Short noise burst that decays
  for(let i=0;i<d.length;i++){
    const env=Math.exp(-i/(audioCtx.sampleRate*0.03));
    d[i]=(Math.random()*2-1)*env;
  }
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  const bp=audioCtx.createBiquadFilter();
  bp.type='bandpass';
  // Randomise pitch for variety — 400–900 Hz
  bp.frequency.value=400+Math.random()*500;
  bp.Q.value=18;
  const g=audioCtx.createGain(); g.gain.value=0.55;
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  src.start(t);

  // Short reverb tail — echo drip off concrete wall
  const tail=audioCtx.createBuffer(1,audioCtx.sampleRate*0.4,audioCtx.sampleRate);
  const td=tail.getChannelData(0);
  for(let i=0;i<td.length;i++) td[i]=(Math.random()*2-1)*Math.exp(-i/(audioCtx.sampleRate*0.08))*0.25;
  const ts=audioCtx.createBufferSource(); ts.buffer=tail;
  const tg=audioCtx.createGain(); tg.gain.value=0.3;
  const delay=audioCtx.createDelay(); delay.delayTime.value=0.06+Math.random()*0.12;
  ts.connect(delay); delay.connect(tg); tg.connect(masterGain);
  ts.start(t+0.05);
}

// Gunshot — sharp crack through distortion
function playGunshot(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.25,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++){
    const env=i<200?i/200:Math.exp(-(i-200)/(audioCtx.sampleRate*0.06));
    d[i]=(Math.random()*2-1)*env;
  }
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
  const g=audioCtx.createGain(); g.gain.setValueAtTime(0.9,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22);
  // Silencer effect — softer high end, punch the mids
  const mid=audioCtx.createBiquadFilter(); mid.type='peaking'; mid.frequency.value=800; mid.gain.value=8;
  src.connect(lp); lp.connect(mid); mid.connect(g); g.connect(masterGain);
  src.start(t);
}

// Enemy growl — pitched noise burst when chasing
function playGrowl(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.35,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  const pitch=80+Math.random()*40;
  for(let i=0;i<d.length;i++){
    const env=Math.exp(-i/(audioCtx.sampleRate*0.12));
    d[i]=Math.sin(i/audioCtx.sampleRate*pitch*Math.PI*2)*0.5*(Math.random()*0.5+0.5)*env;
  }
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=600;
  const g=audioCtx.createGain(); g.gain.value=0.5;
  src.connect(lp); lp.connect(g); g.connect(masterGain);
  src.start(t);
}

// Player hurt — sharp distorted thud
function playHurt(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  const osc=audioCtx.createOscillator();
  osc.type='sawtooth'; osc.frequency.setValueAtTime(180,t); osc.frequency.exponentialRampToValueAtTime(40,t+0.15);
  const g=audioCtx.createGain(); g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  const dist=audioCtx.createWaveShaper();
  const curve=new Float32Array(256);
  for(let i=0;i<256;i++){const x=i*2/255-1; curve[i]=Math.tanh(x*5);}
  dist.curve=curve;
  osc.connect(dist); dist.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t+0.2);
}

// Item pickup chime — two-tone metallic
function playPickup(){
  if(!audioCtx)return;
  const t=audioCtx.currentTime;
  [880,1320].forEach((freq,i)=>{
    const osc=audioCtx.createOscillator();
    osc.type='sine'; osc.frequency.value=freq;
    const g=audioCtx.createGain();
    g.gain.setValueAtTime(0,t+i*0.08);
    g.gain.linearRampToValueAtTime(0.18,t+i*0.08+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+i*0.08+0.4);
    osc.connect(g); g.connect(masterGain);
    osc.start(t+i*0.08); osc.stop(t+i*0.08+0.45);
  });
}

// Modulate drone intensity by nearest enemy
function updateDroneIntensity(){
  if(!droneGain||!audioCtx)return;
  const nearest=enemies.reduce((mn,e)=>{
    if(e.state==='dead')return mn;
    return Math.min(mn,Math.hypot(e.x-player.x,e.y-player.y));
  },20);
  const threat=Math.max(0,1-nearest/8);
  const target=0.06+threat*0.14;
  droneGain.gain.setTargetAtTime(target,audioCtx.currentTime,0.8);
}

// ── Room detection ────────────────────────────────────────────
let lastRoomType=0;
const ROOM_NAMES={
  6:'OPERATING THEATRE',
  7:'PATIENT WARD',
  8:'COLD STORAGE',
};
function detectRoom(){
  const mx=Math.floor(player.x), my=Math.floor(player.y);
  let rtype=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const c=mapAt(mx+dx,my+dy);
    if(c>=6&&c<=8)rtype=Math.max(rtype,c);
  }
  lastRoomType=rtype; // silently update for ceiling/floor tinting only
}

function startGame(){
  initAudio();
  currentLevel=0;
  player.health=100;
  score=0; kills=0;
  flashlight.battery=100; flashlight.on=true; flashlight.flicker=0;
  attackFlash=0; damageFlash=0; hurtTimer=0; gameTime=0;
  shakeMag=0; shakeX=0; shakeY=0; bloodSplats=[];
  camBobT=0; camBobAmt=0; weaponBobT=0; weaponBobAmt=0; weaponKick=0; weaponSway=0;
  joystick={active:false,sx:0,sy:0,cx:0,cy:0};
  atkBtn={active:false};
  loadLevel(0);
  introTimer=0;
  state=S.INTRO;
}

function togglePause(){
  if(state===S.PLAY)state=S.PAUSE;
  else if(state===S.PAUSE)state=S.PLAY;
}

function doAttack(){
  if(state!==S.PLAY)return;
  attackFlash=8;
  weaponKick=9;
  playGunshot();  // kick gun upward on fire
  // Check if any enemy is in front within range
  enemies.forEach((e,i)=>{
    if(e.health<=0)return;
    const dx=e.x-player.x, dy=e.y-player.y;
    const dist=Math.hypot(dx,dy);
    if(dist>12)return;  // effective pistol range
    const ang=Math.atan2(dy,dx)-player.angle;
    let a=ang;while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;
    if(Math.abs(a)>FOV/2)return;  // outside FOV
    if(!hasLOS(player.x,player.y,e.x,e.y))return;  // wall in the way
      e.health--;
      e.hitFlash=14;
      e.state='chase';
      // World-space blood puddle where enemy stands
      for(let b=0;b<4;b++) bloodDecals.push({
        wx:e.x+(Math.random()-.5)*0.6,
        wy:e.y+(Math.random()-.5)*0.6,
        r:0.2+Math.random()*0.3, a:1.0
      });
      // Screen splatter
      for(let b=0;b<5;b++) bloodSplats.push({
        x:RW/2+(Math.random()-.5)*55, y:RH/2+(Math.random()-.5)*35,
        r:2+Math.random()*7, a:0.65+Math.random()*.3
      });
      if(e.health<=0){e.state='dead';kills++;score+=100;showMsg('+100  ENEMY DOWN');}
  });
}

function tryPickup(){
  items.forEach(it=>{
    if(!it.alive)return;
    if(Math.hypot(it.x-player.x,it.y-player.y)>1.0)return;
    if(it.type==='key'){player.hasKey=true;it.alive=false;showMsg('KEY OBTAINED');playPickup();}
    if(it.type==='health'){player.health=Math.min(player.maxHealth,player.health+30);it.alive=false;showMsg('+30 HEALTH');playPickup();}
  });
}

let msgText='',msgTimer=0;
function showMsg(t){msgText=t;msgTimer=2.5;}

// ── Main loop ─────────────────────────────────────────────────
let lt=0,dt=0;
function loop(ts){
  dt=Math.min((ts-lt)/1000,.05);lt=ts;
  if(state===S.PLAY||state===S.INTRO){
    gameTime+=dt;
    if(state===S.PLAY){
      handleMovement();
      updateFlashlight();
      updateEnemies();
      tryPickup();
      detectRoom();
      if(attackFlash>0)attackFlash--;
      if(damageFlash>0)damageFlash--;
      if(msgTimer>0)msgTimer-=dt;
      shakeMag=Math.max(0,shakeMag-dt*22);
      shakeX=(Math.random()-.5)*shakeMag*2;
      shakeY=(Math.random()-.5)*shakeMag*2;
      bloodSplats=bloodSplats.filter(b=>(b.a-=dt*0.35,b.a>0));
      bloodDecals=bloodDecals.filter(b=>{if(b.permanent)return true;b.a-=dt*0.04;return b.a>0.05;});
      // ── Audio updates ──
      dripTimer-=dt;
      if(dripTimer<=0){
        playDrip();
        dripTimer=2.5+Math.random()*6; // drip every 2.5–8.5 seconds
      }
      groanTimer-=dt;
      if(groanTimer<=0){
        // Distant groan only when an enemy is chasing
        const anyChasing=enemies.some(e=>e.state==='chase');
        if(anyChasing)playGrowl();
        groanTimer=6+Math.random()*10;
      }
      updateDroneIntensity();
      lightFlicker=lightFlicker.map(v=>{
        if(Math.random()<0.025)return Math.random()<0.12?0.15:0.8+Math.random()*.2;
        return v+(1.0-v)*0.1;
      });
      if(mapAt(player.x,player.y)===3){
        score+=500;
        if(currentLevel<LEVELS.length-1){
          currentLevel++;
          loadLevel(currentLevel);
          showMsg(`LEVEL ${currentLevel+1}: ${LEVELS[currentLevel].name}`);
        } else {
          state=S.WIN;
        }
      }
    }
  }
  render();
  requestAnimationFrame(loop);
}

function handleMovement(){
  let fw=0, strafe=0, turn=0;
  if(K['KeyW']||K['ArrowUp'])    fw=1;
  if(K['KeyS']||K['ArrowDown'])  fw=-1;
  if(K['KeyA']||K['ArrowLeft'])  turn=-1;
  if(K['KeyD']||K['ArrowRight']) turn=1;

  // Left joystick: up/down = fwd, left/right = turn
  if(joystick.active){
    const dx=joystick.cx-joystick.sx, dy=joystick.cy-joystick.sy;
    const d=Math.hypot(dx,dy);
    if(d>6){ fw=-dy/Math.max(d,1); turn=dx/Math.max(d,1); }
  }

  // Mouse look (pointer lock)
  if(mouseDX!==0){ player.angle+=mouseDX*0.004; mouseDX=0; }

  // Turn
  if(turn!==0) player.angle+=turn*TURN_SPD*dt;

  const propBlock=(px,py)=>props.some(p=>p.solid&&Math.hypot(p.x-px,p.y-py)<0.5);

  // Forward / backward
  if(fw!==0){
    const nx=player.x+Math.cos(player.angle)*fw*MOVE_SPD*dt;
    const ny=player.y+Math.sin(player.angle)*fw*MOVE_SPD*dt;
    if(!isWall(nx,player.y)&&!propBlock(nx,player.y)) player.x=nx;
    if(!isWall(player.x,ny)&&!propBlock(player.x,ny)) player.y=ny;
  }

  // Strafe (Q/E keys)
  if(K['KeyQ']) strafe=-1;
  if(K['KeyE']) strafe=1;
  if(strafe!==0){
    const sa=player.angle+Math.PI/2;
    const nx=player.x+Math.cos(sa)*strafe*MOVE_SPD*dt;
    const ny=player.y+Math.sin(sa)*strafe*MOVE_SPD*dt;
    if(!isWall(nx,player.y)&&!propBlock(nx,player.y)) player.x=nx;
    if(!isWall(player.x,ny)&&!propBlock(player.x,ny)) player.y=ny;
  }

  const isMoving=(fw!==0||strafe!==0), isTurning=(turn!==0);
  if(isMoving){camBobAmt=Math.min(1,camBobAmt+dt*5);camBobT+=dt*9;}
  else{camBobAmt=Math.max(0,camBobAmt-dt*8);}
  if(isMoving||isTurning){weaponBobAmt=Math.min(1,weaponBobAmt+dt*4);weaponBobT+=dt*8;}
  else{weaponBobAmt=Math.max(0,weaponBobAmt-dt*6);}
  weaponKick=Math.max(0,weaponKick-dt*18);
  weaponSway+=((isTurning)?turn*0.6:-weaponSway*0.12)*dt*10;

  if(player.hasKey){
    const mx=Math.floor(player.x),my=Math.floor(player.y);
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dx,dy])=>{
      if(mapAt(mx+dx,my+dy)===2){MAP[my+dy][mx+dx]=0;player.hasKey=false;showMsg('DOOR UNLOCKED');}
    });
  }
}

function updateFlashlight(){
  if(flashlight.on){
    flashlight.battery=Math.max(0,flashlight.battery-FLASH_DRAIN);
    if(flashlight.battery<15){flashlight.flicker=Math.random()<0.15?1:0;}
    else flashlight.flicker=0;
    if(flashlight.battery===0)flashlight.on=false;
  }
}

function updateEnemies(){
  enemies.forEach((e,i)=>{
    if(e.state==='dead')return;
    if(e.hitFlash>0)e.hitFlash--;
    enemyAtkTimers[i]=Math.max(0,enemyAtkTimers[i]-dt);

    const dx=player.x-e.x, dy=player.y-e.y;
    const distToPlayer=Math.hypot(dx,dy);

    // Can enemy see player?
    const canSee=distToPlayer<ENEMY_SIGHT && hasLOS(e.x,e.y,player.x,player.y);

    if(canSee){
      if(e.state!=='chase')playGrowl(); // growl on first spot
      e.state='chase';e.alertTimer=3.0;
    }
    else if(e.alertTimer>0){e.alertTimer-=dt;}
    else if(e.state==='chase'){e.state='patrol';}

    if(e.state==='chase'||e.alertTimer>0){
      // Move toward player
      const ang=Math.atan2(dy,dx);
      const nx=e.x+Math.cos(ang)*ENEMY_SPD;
      const ny=e.y+Math.sin(ang)*ENEMY_SPD;
      if(!isWall(nx,e.y))e.x=nx;
      if(!isWall(e.x,ny))e.y=ny;
      e.angle=ang;
      // Attack player
      if(distToPlayer<ENEMY_ATK_RANGE&&enemyAtkTimers[i]<=0){
        player.health-=12;
        damageFlash=14;
        shakeMag=5;
        hurtTimer=0.4;
        playHurt();
        enemyAtkTimers[i]=ENEMY_ATK_CD;
        if(player.health<=0){player.health=0;state=S.DEAD;}
      }
    } else if(e.state==='patrol'){
      // Simple patrol: turn and walk
      e.patrolAngle+=0.008;
      const nx=e.x+Math.cos(e.patrolAngle)*ENEMY_SPD*0.5;
      const ny=e.y+Math.sin(e.patrolAngle)*ENEMY_SPD*0.5;
      if(!isWall(nx,e.y))e.x=nx; else e.patrolAngle+=Math.PI*0.5;
      if(!isWall(e.x,ny))e.y=ny;
      e.angle=e.patrolAngle;
    }
  });
}

function hasLOS(x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,dist=Math.hypot(dx,dy);
  const steps=Math.ceil(dist*4);
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(isWall(x1+dx*t,y1+dy*t))return false;
  }
  return true;
}

// ── RENDER ────────────────────────────────────────────────────
function render(){
  X.fillStyle='#000';X.fillRect(0,0,RW,RH);
  if(state===S.TITLE){drawTitle();return;}
  if(state===S.DEAD) {drawDead(); return;}
  if(state===S.WIN)  {drawWin();  return;}

  // Screen shake applied to 3D world only
  X.save();
  X.translate(Math.round(shakeX), Math.round(shakeY));
  drawWorld();
  drawSprites();
  X.restore();

  drawFlashlight();
  drawSigns();
  drawBloodSplats();
  drawColorGrade();
  drawHUD();
  drawMobileControls();
  drawMessages();
  if(state===S.INTRO)drawIntro();
  if(state===S.PAUSE)drawPause();
  drawVHS();
}

// ── 3D World rendering — into offscreen 320×200 canvas ──────────
function drawWorld(){
  const bobOffset = Math.sin(camBobT)*2.5*camBobAmt;
  const horizon   = Math.floor(OH*0.5 + bobOffset);
  const roomT     = lastRoomType;

  // Frame buffer into the small offscreen canvas
  const frame = OX.createImageData(OW, OH);
  const buf   = frame.data;

  function putPx(x,y,r,g,b){
    const i=(y*OW+x)*4;
    buf[i]=r; buf[i+1]=g; buf[i+2]=b; buf[i+3]=255;
  }

  const floorTex = roomT===6?TEX_OR:roomT===7?TEX_WARD:roomT===8?TEX_MORGUE:TEX_CORR;
  const ceilR    = roomT===8?[12,14,22]:roomT===6?[20,18,14]:[18,16,13];

  const cosA=Math.cos(player.angle), sinA=Math.sin(player.angle);
  const cpX=-sinA*0.66, cpY=cosA*0.66;

  // ── CEILING ────────────────────────────────────────────────
  for(let y=0; y<horizon; y++){
    const rD=(horizon-y<1)?1e30:(OH*0.5-bobOffset)/(horizon-y);
    const fade=Math.max(0,Math.min(0.75,(horizon-y)/horizon*1.1));
    const stX=rD*cpX*2/OW, stY=rD*cpY*2/OW;
    let fX=player.x+rD*(cosA-cpX), fY=player.y+rD*(sinA-cpY);
    for(let x=0;x<OW;x++){
      const tx=((((fX*0.5)%1)+1)%1*(TEX_SIZE-1))|0;
      const ty=((((fY*0.5)%1)+1)%1*(TEX_SIZE-1))|0;
      const idx=(ty*TEX_SIZE+tx)*4;
      putPx(x,y,(TEX_CORR[idx]*0.16*fade+ceilR[0]*fade)|0,
               (TEX_CORR[idx+1]*0.16*fade+ceilR[1]*fade)|0,
               (TEX_CORR[idx+2]*0.16*fade+ceilR[2]*fade)|0);
      fX+=stX; fY+=stY;
    }
  }

  // Ceiling pipes
  const p1=(horizon*0.25)|0, p2=(horizon*0.50)|0;
  for(let x=0;x<OW;x++){
    for(let py=p1;py<p1+2;py++) putPx(x,py,14,12,9);
    putPx(x,p1,55,50,42);
    putPx(x,p2,16,14,11);
    if(x%13<1) for(let py=0;py<p1+2;py++) putPx(x,py,11,10,8);
    if((x+7)%13<1) for(let py=p1;py<p2+1;py++) putPx(x,py,14,12,10);
  }

  // ── FLOOR ──────────────────────────────────────────────────
  for(let y=horizon+1; y<OH; y++){
    const t=(y-horizon)/(OH-horizon);
    const rD=(OH*0.5-bobOffset)/(y-horizon+0.001);
    const shade=Math.max(0.07,0.12+t*0.88);

    // Per-row lighting
    let rowCool=0, rowWarm=0;
    for(let li=0;li<LIGHT_SOURCES.length;li++){
      const ls=LIGHT_SOURCES[li];
      const d=Math.sqrt((ls.x+0.5-player.x)**2+(ls.y+0.5-player.y)**2);
      if(ls.warm) rowWarm+=Math.max(0,1-d/8)*lightFlicker[li]*(ls.bright||1.4)*0.7;
      else        rowCool+=Math.max(0,1-d/14)*lightFlicker[li]*0.85;
    }
    if(flashlight.on&&!flashlight.flicker) rowCool+=Math.max(0,1-rD/12)*0.8;
    const L=Math.min(1.0,(0.18+rowCool)*shade);
    const wr=Math.min(48,rowWarm*48)|0, wg=Math.min(24,rowWarm*24)|0;

    const stX=rD*cpX*2/OW, stY=rD*cpY*2/OW;
    let fX=player.x+rD*(cosA-cpX), fY=player.y+rD*(sinA-cpY);
    const db=(y&1)?2:-2;
    for(let x=0;x<OW;x++){
      const tx=((((fX%1)+1)%1)*(TEX_SIZE-1))|0;
      const ty=((((fY%1)+1)%1)*(TEX_SIZE-1))|0;
      const idx=(ty*TEX_SIZE+tx)*4;
      putPx(x,y,
        Math.min(255,Math.max(0,(floorTex[idx  ]*L+wr+((x&1)?db:-db))|0)),
        Math.min(255,Math.max(0,(floorTex[idx+1]*L+wg)|0)),
        Math.min(255,Math.max(0,(floorTex[idx+2]*L)|0))
      );
      fX+=stX; fY+=stY;
    }
  }

  // ── WALLS — 320-column DDA ─────────────────────────────────
  for(let col=0; col<OW; col++){
    const rayAngle=player.angle-HALF_FOV+(col/OW)*FOV;
    const rdx=Math.cos(rayAngle), rdy=Math.sin(rayAngle);
    let mX=player.x|0, mY=player.y|0;
    const dX=Math.abs(1/rdx)||1e30, dY=Math.abs(1/rdy)||1e30;
    let sX,sY,stepX,stepY,side=0,wType=1;
    stepX=rdx<0?-1:1; sX=rdx<0?(player.x-mX)*dX:(mX+1-player.x)*dX;
    stepY=rdy<0?-1:1; sY=rdy<0?(player.y-mY)*dY:(mY+1-player.y)*dY;
    for(let i=0;i<64;i++){
      if(sX<sY){sX+=dX;mX+=stepX;side=0;}else{sY+=dY;mY+=stepY;side=1;}
      const cv=mapAt(mX,mY);
      if(cv===1||cv===2||cv===3||cv===6||cv===7||cv===8){wType=cv;break;}
    }
    const dist=Math.max(0.01, side===0?sX-dX:sY-dY);
    const wallX=((side===0?(player.y+dist*rdy):(player.x+dist*rdx))%1+1)%1;
    zBuf[col]=dist;

    const lineH=OH/dist;
    const wallTopF=(OH+bobOffset*2-lineH)*0.5;
    const drawS=Math.max(0,wallTopF|0);
    const drawE=Math.min(OH-1,(wallTopF+lineH)|0);

    const wx=player.x+rdx*dist, wy=player.y+rdy*dist;
    let cool=0, warm=0;
    for(let li=0;li<LIGHT_SOURCES.length;li++){
      const ls=LIGHT_SOURCES[li];
      const ldx=ls.x+0.5-wx, ldy=ls.y+0.5-wy;
      const d=Math.sqrt(ldx*ldx+ldy*ldy);
      if(ls.warm) warm+=Math.max(0,1-d/8.0)*lightFlicker[li]*(ls.bright||1.4)*0.9;
      else        cool+=Math.max(0,1-d/13 )*lightFlicker[li]*1.0;
    }
    if(flashlight.on&&!flashlight.flicker){
      let a=rayAngle-player.angle;
      while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2;
      cool+=Math.max(0,1-Math.abs(a)/HALF_FOV)*Math.max(0,1-dist/14)*1.3;
    }
    const distSh=Math.max(0.18,1-dist/28)*(side===1?0.82:1.0);
    const L=Math.min(1.0,(0.22+cool)*distSh);
    const wr=Math.min(52,warm*52)|0, wg=Math.min(27,warm*27)|0;

    const tex=WALL_TEX[wType];
    const texX=Math.max(0,Math.min(TEX_SIZE-1,(wallX*(TEX_SIZE-1))|0));
    for(let y=drawS; y<=drawE; y++){
      const vFrac=Math.max(0,Math.min(0.9999,(y-wallTopF)/lineH));
      const texY=(vFrac*(TEX_SIZE-1))|0;
      const idx=(texY*TEX_SIZE+texX)*4;
      const db=((col^y)&1)?3:-3;
      if(!tex){ putPx(col,y,15,(140*L)|0,(45*L)|0); continue; }
      putPx(col,y,
        Math.min(255,Math.max(0,(tex[idx  ]*L+wr+db)|0)),
        Math.min(255,Math.max(0,(tex[idx+1]*L+wg+db)|0)),
        Math.min(255,Math.max(0,(tex[idx+2]*L+db)|0))
      );
    }
  }

  OX.putImageData(frame,0,0);
  // Scale up to fill main canvas (3× upscale, crisp pixels)
  X.imageSmoothingEnabled=false;
  X.drawImage(OC,0,0,RW,RH);
}

// ── Sprite rendering ─────────────────────────────────────────
function drawSprites(){
  // Gather all sprites (enemies + items + props)
  const sprites=[];
  enemies.forEach((e,i)=>{
    if(e.state==='dead')return;
    const sp=projectSprite(e.x,e.y);
    if(sp)sprites.push({...sp,type:'enemy',idx:i,e});
  });
  items.forEach(it=>{
    if(!it.alive)return;
    const sp=projectSprite(it.x,it.y);
    if(sp)sprites.push({...sp,type:it.type,it});
  });
  props.forEach(p=>{
    const sp=projectSprite(p.x,p.y);
    if(sp)sprites.push({...sp,type:'prop',subtype:p.type});
  });
  // Sort by distance (farthest first)
  sprites.sort((a,b)=>b.dist-a.dist);

  sprites.forEach(sp=>{
    const {screenX,dist,h,type,subtype,e,it}=sp;
    const w=Math.max(1,h);
    const x0=Math.floor(screenX-w/2);

    if(type==='enemy'){
      const alert=e.state==='chase'||e.alertTimer>0;
      const hit=e.hitFlash>0;
      const y0=Math.floor((RH-h)/2);

      for(let col=x0;col<x0+w;col++){
        if(col<0||col>=RW)continue;
        if(dist>zBuf[(col/Z_SCALE)|0])continue;
        const u=(col-x0)/w;

        // ── Gaunt creature anatomy in UV ──────────────────────
        // HEAD — narrow, elongated, skull-like
        const hL=x0+Math.floor(w*.32), hR=x0+Math.floor(w*.68);
        const headTop=y0, headBot=y0+Math.floor(h*.22);
        if(col>=hL&&col<hR){
          // Skull colour — pale grey-green
          const sk=hit?'#ee3333':alert?'#8a9a7a':'#7a8a6c';
          X.fillStyle=sk; X.fillRect(col,headTop,1,headBot-headTop);
          // Hollow black eye sockets (close range only)
          if(dist<7){
            const eyeY=y0+Math.floor(h*.08);
            const eyeH=Math.max(1,Math.floor(h*.07));
            if(u>0.35&&u<0.46){X.fillStyle='#080508';X.fillRect(col,eyeY,1,eyeH);}
            if(u>0.54&&u<0.65){X.fillStyle='#080508';X.fillRect(col,eyeY,1,eyeH);}
            // Red iris glow when chasing
            if(alert&&dist<4){
              if((u>0.37&&u<0.44)||(u>0.56&&u<0.63)){
                X.fillStyle='#660000'; X.fillRect(col,eyeY+1,1,Math.max(1,eyeH-2));
              }
            }
          }
          // Jaw / mouth — dark gash
          if(u>0.38&&u<0.62){
            const mY=y0+Math.floor(h*.17);
            X.fillStyle='#1a0808'; X.fillRect(col,mY,1,Math.max(1,Math.floor(h*.04)));
          }
        }

        // NECK — very thin
        const nL=x0+Math.floor(w*.44), nR=x0+Math.floor(w*.56);
        const neckTop=headBot, neckBot=y0+Math.floor(h*.27);
        if(col>=nL&&col<nR){
          X.fillStyle=hit?'#cc2222':'#5a6a52';
          X.fillRect(col,neckTop,1,neckBot-neckTop);
        }

        // SHOULDERS — wide angular shelf
        const shL=x0+Math.floor(w*.12), shR=x0+Math.floor(w*.88);
        const shTop=y0+Math.floor(h*.25), shBot=y0+Math.floor(h*.32);
        if(col>=shL&&col<shR){
          X.fillStyle=hit?'#bb2020':'#2a2a3a'; // dark torn gown
          X.fillRect(col,shTop,1,shBot-shTop);
          // Shoulder bone protrusion highlight
          if((u>0.12&&u<0.22)||(u>0.78&&u<0.88)){
            X.fillStyle='#4a5a44'; X.fillRect(col,shTop,1,Math.floor((shBot-shTop)*0.5));
          }
        }

        // TORSO — torn hospital gown
        const tL=x0+Math.floor(w*.28), tR=x0+Math.floor(w*.72);
        const torsoTop=y0+Math.floor(h*.30), torsoBot=y0+Math.floor(h*.68);
        if(col>=tL&&col<tR){
          X.fillStyle=hit?'#cc1818':'#1e1e2c';
          X.fillRect(col,torsoTop,1,torsoBot-torsoTop);
          // Rib suggestion stripes
          if(dist<5&&u>0.34&&u<0.66){
            for(let ri=0;ri<3;ri++){
              const ry=torsoTop+Math.floor((torsoBot-torsoTop)*(0.2+ri*0.22));
              X.fillStyle='rgba(100,130,90,0.35)'; X.fillRect(col,ry,1,1);
            }
          }
          // Blood stain on gown when hit
          if(hit&&u>0.38&&u<0.58){
            X.fillStyle='rgba(180,0,0,0.7)';
            X.fillRect(col,torsoTop+Math.floor(h*.05),1,Math.floor(h*.12));
          }
        }

        // ARMS — long, past hips, spindly
        const armTop=y0+Math.floor(h*.28), armBot=y0+Math.floor(h*.84);
        const laL=x0+Math.floor(w*.06), laR=x0+Math.floor(w*.20);
        const raL=x0+Math.floor(w*.80), raR=x0+Math.floor(w*.94);
        const armCol=hit?'#cc2222':alert?'#808a72':'#6a7862';
        if((col>=laL&&col<laR)||(col>=raL&&col<raR)){
          X.fillStyle=armCol; X.fillRect(col,armTop,1,armBot-armTop);
        }
        // Bony hands
        const handTop=armBot, handBot=y0+Math.floor(h*.90);
        if((col>=laL&&col<laR)||(col>=raL&&col<raR)){
          X.fillStyle=hit?'#dd3333':'#5a6a50';
          X.fillRect(col,handTop,1,handBot-handTop);
        }

        // LEGS
        const legTop=y0+Math.floor(h*.66), legBot=y0+h;
        const ll1=x0+Math.floor(w*.30), lr1=x0+Math.floor(w*.46);
        const ll2=x0+Math.floor(w*.54), lr2=x0+Math.floor(w*.70);
        const legCol=hit?'#cc2222':'#1a1a28';
        if((col>=ll1&&col<lr1)||(col>=ll2&&col<lr2)){
          X.fillStyle=legCol; X.fillRect(col,legTop,1,legBot-legTop);
        }

        zBuf[col]=dist;
      }

      // Alert "!" indicator
      if(alert&&dist<7){
        X.fillStyle='rgba(255,40,40,.9)';
        X.font='bold 7px monospace'; X.textAlign='center';
        X.fillText('!',screenX,Math.floor((RH-h)/2)-3);
      }

      // HP pips close range
      if(dist<3&&e.health>0){
        for(let p=0;p<e.health;p++){
          X.fillStyle='#ff4444';
          X.fillRect(screenX-8+p*5, Math.floor((RH-h)/2)-8, 4, 3);
        }
      }
    } else if(type==='prop'){
      // ── Hospital prop sprites ──────────────────────────────
      // Per-type scale — lamp is huge, table+corpse slightly bigger
      const pScale=subtype==='or_lamp'?2.2:
                   subtype==='or_table'||subtype==='corpse'?1.3:
                   subtype==='shadow_figure'?1.15:1.0;
      const ph=Math.floor(h*pScale);
      const pw=Math.max(1,ph);
      const px0=Math.floor(screenX-pw/2);

      // Lamp hangs from ceiling; everything else sits on floor
      const yShiftFrac = subtype==='or_lamp' ? -0.68
                       : subtype==='corpse'  ? -0.12   // sits on table surface
                       : 0;
      const y0=Math.floor((RH-ph)/2) + Math.floor(ph*yShiftFrac);

      for(let col=px0;col<px0+pw;col++){
        if(col<0||col>=RW)continue;
        if(dist>zBuf[(col/Z_SCALE)|0])continue;
        const u=(col-px0)/pw;

        // ── OPERATING TABLE ────────────────────────────────
        if(subtype==='or_table'){
          // Central pedestal
          if(u>0.42&&u<0.58){
            X.fillStyle='#5a6255';X.fillRect(col,y0+Math.floor(ph*0.55),1,Math.floor(ph*0.45));
          }
          // Leg crossbar (bottom)
          if(u>0.12&&u<0.88){
            X.fillStyle='#4a5248';X.fillRect(col,y0+Math.floor(ph*0.88),1,Math.floor(ph*0.08));
          }
          // Side rails
          if(u<0.10||u>0.90){
            X.fillStyle='#6a7065';X.fillRect(col,y0+Math.floor(ph*0.10),1,Math.floor(ph*0.80));
          }
          // Table surface (matte stainless, stained)
          if(u>0.10&&u<0.90){
            X.fillStyle='#7a8275';X.fillRect(col,y0+Math.floor(ph*0.06),1,Math.floor(ph*0.50));
            // Highlight edge
            if(dist<7){X.fillStyle='rgba(180,190,170,0.45)';X.fillRect(col,y0+Math.floor(ph*0.06),1,Math.floor(ph*0.05));}
            // Old blood stain soaked into table surface
            if(u>0.20&&u<0.75){
              X.fillStyle='rgba(60,8,8,0.55)';
              X.fillRect(col,y0+Math.floor(ph*0.30),1,Math.floor(ph*0.25));
            }
          }
        }

        // ── CORPSE UNDER SHEET ─────────────────────────────
        else if(subtype==='corpse'){
          if(u>0.04&&u<0.96){
            const ct=y0+Math.floor(ph*0.04);
            const ch=Math.floor(ph*0.62);

            // HEAD lump — left end, visible skull shape under sheet
            if(u>0.04&&u<0.20){
              const headH=Math.floor(ph*0.22);
              const headTop=ct-Math.floor(ph*0.10);
              // Skull bump
              X.fillStyle='#c8c0a8';X.fillRect(col,headTop,1,headH);
              // Crown (slightly raised)
              if(u>0.07&&u<0.17){X.fillStyle='#d0c8b0';X.fillRect(col,headTop-Math.floor(ph*0.04),1,Math.floor(ph*0.06));}
              // Dark sunken where eyes/nose are under sheet
              if(u>0.09&&u<0.14){X.fillStyle='rgba(40,30,20,0.4)';X.fillRect(col,headTop+Math.floor(headH*0.40),1,Math.floor(headH*0.25));}
            }

            // BODY — dirty cream sheet
            if(u>0.18&&u<0.96){
              // Shoulders bump
              const shBump=(u>0.20&&u<0.32)?Math.floor(ph*0.06):0;
              // Chest/ribcage contour
              const ribBump=(u>0.30&&u<0.58)?Math.floor(ph*0.03):0;
              X.fillStyle='#ccc8b0';
              X.fillRect(col,ct-shBump-ribBump,1,ch+shBump+ribBump);
              // Deep dark blood saturation — enormous central stain
              if(u>0.25&&u<0.72){
                X.fillStyle='rgba(55,4,4,0.90)';
                X.fillRect(col,ct+Math.floor(ch*0.30),1,Math.floor(ch*0.52));
                // Wet bright blood on top
                if(u>0.30&&u<0.62){
                  X.fillStyle='rgba(140,12,12,0.65)';
                  X.fillRect(col,ct+Math.floor(ch*0.32),1,Math.floor(ch*0.22));
                }
              }
              // Sheet folds/creases (darker stripes)
              if(((u>0.62&&u<0.65)||(u>0.72&&u<0.75)||(u>0.82&&u<0.84))&&dist<6){
                X.fillStyle='rgba(0,0,0,0.20)';X.fillRect(col,ct,1,ch);
              }
            }

            // SURGICAL INSTRUMENTS — right end of table, beside body
            if(u>0.76&&u<0.96&&dist<5){
              // Scattered scalpels/scissors — thin metallic lines
              const inst1=ct+Math.floor(ch*0.68);
              const inst2=ct+Math.floor(ch*0.78);
              const inst3=ct+Math.floor(ch*0.58);
              X.fillStyle='#d0d0c8';X.fillRect(col,inst1,1,2);
              if(u>0.80&&u<0.94){X.fillStyle='#c0c0b8';X.fillRect(col,inst2,1,2);}
              if(u>0.78&&u<0.88){X.fillStyle='rgba(180,180,170,0.7)';X.fillRect(col,inst3,1,1);}
              // Dark handle of scalpel
              if(u>0.82&&u<0.90){X.fillStyle='#5a5a52';X.fillRect(col,inst1+2,1,3);}
            }

            // Shadow beneath body edges
            if(u<0.08||u>0.93){X.fillStyle='rgba(0,0,0,0.55)';X.fillRect(col,ct,1,ch);}
          }
        }

        // ── SURGICAL OVERHEAD LAMP ─────────────────────────
        else if(subtype==='or_lamp'){
          // Ceiling pipe/arm  (u centre, from screen top down to housing)
          if(u>0.47&&u<0.53){
            X.fillStyle='#3a3830';
            X.fillRect(col,0,1,Math.max(0,y0+Math.floor(ph*0.04)));
          }
          // Horizontal arm brace
          if(u>0.20&&u<0.80){
            X.fillStyle='#4a4840';
            X.fillRect(col,y0,1,Math.floor(ph*0.07));
          }

          // Main housing — large dark-metal disc
          const hTop=y0+Math.floor(ph*0.05);
          const hH=Math.floor(ph*0.50);
          if(u>0.04&&u<0.96){
            // Outer rim (gunmetal dark)
            X.fillStyle='#606055';X.fillRect(col,hTop,1,hH);
            // Rim highlight on outer edge
            if(u<0.09||u>0.91){X.fillStyle='#8a8878';X.fillRect(col,hTop,1,Math.floor(hH*0.15));}
          }

          // Inner reflector bowl — concave polished chrome look
          if(u>0.10&&u<0.90){
            // Edge of bowl slightly lighter
            const bowlFrac=Math.abs(u-0.5)*2; // 0 at centre, 1 at edge
            const bowlBright=Math.floor(180+bowlFrac*50);
            X.fillStyle=`rgb(${bowlBright},${bowlBright},${Math.floor(bowlBright*0.88)})`;
            X.fillRect(col,hTop+Math.floor(hH*0.12),1,Math.floor(hH*0.72));
          }

          // BULB CLUSTERS — 6 bright spots across the reflector
          if(u>0.12&&u<0.88){
            const bulbPhase=((u-0.12)/0.76*6)%1;
            const inBulb=bulbPhase<0.60;
            const inBright=bulbPhase<0.38;
            if(inBulb){
              // Hot white bulb
              X.fillStyle=inBright?'#fffffa':'#f0eec8';
              X.fillRect(col,hTop+Math.floor(hH*0.22),1,Math.floor(hH*0.48));
              // Bloom glow around bulb
              if(inBright&&dist<6){
                X.globalAlpha=0.25;X.fillStyle='#fffff0';
                X.fillRect(col,hTop+Math.floor(hH*0.10),1,Math.floor(hH*0.72));
                X.globalAlpha=1;
              }
            } else {
              // Dark divider between bulb clusters
              X.fillStyle='#383630';
              X.fillRect(col,hTop+Math.floor(hH*0.22),1,Math.floor(hH*0.48));
            }
          }

          // Bottom rim shadow
          if(u>0.06&&u<0.94){
            X.fillStyle='rgba(0,0,0,0.50)';
            X.fillRect(col,hTop+Math.floor(hH*0.88),1,Math.floor(hH*0.12));
          }

          // Downward light wash cone (visible close range)
          if(dist<5&&u>0.25&&u<0.75){
            const coneY=hTop+hH;
            const coneH=Math.floor(ph*0.28*(1-dist/5));
            X.globalAlpha=0.09*(1-dist/5);
            X.fillStyle='#ffffd0';
            X.fillRect(col,coneY,1,coneH);
            X.globalAlpha=1;
          }
        }

        // ── PATIENT BED ────────────────────────────────────
        else if(subtype==='bed'){
          if(u>0.06&&u<0.94){
            // Headboard / footboard
            if(u<0.13||u>0.87){X.fillStyle='#6a6858';X.fillRect(col,y0+Math.floor(ph*0.05),1,Math.floor(ph*0.85));}
            // Rail frame sides
            if((u>0.13&&u<0.18)||(u>0.82&&u<0.87)){X.fillStyle='#5a5848';X.fillRect(col,y0+Math.floor(ph*0.08),1,Math.floor(ph*0.80));}
            // Mattress
            if(u>0.18&&u<0.82){X.fillStyle='#a8a898';X.fillRect(col,y0+Math.floor(ph*0.10),1,Math.floor(ph*0.60));}
            // Pillow
            if(u>0.22&&u<0.78){X.fillStyle='#c8c8be';X.fillRect(col,y0+Math.floor(ph*0.08),1,Math.floor(ph*0.14));}
            // Sheet / blanket wrinkled
            if(u>0.18&&u<0.82){X.fillStyle='rgba(60,60,50,0.28)';X.fillRect(col,y0+Math.floor(ph*0.52),1,Math.floor(ph*0.18));}
            // Rust stains on frame close range
            if(dist<4&&(u>0.13&&u<0.18)){X.fillStyle='rgba(100,40,10,0.4)';X.fillRect(col,y0+Math.floor(ph*0.30),1,Math.floor(ph*0.20));}
            // Legs
            if((u>0.10&&u<0.16)||(u>0.84&&u<0.90)){X.fillStyle='#484840';X.fillRect(col,y0+Math.floor(ph*0.80),1,Math.floor(ph*0.20));}
          }
        }

        // ── MEDICAL CART ───────────────────────────────────
        else if(subtype==='cart'){
          if(u>0.15&&u<0.85){
            X.fillStyle='#6e6e64';X.fillRect(col,y0+Math.floor(ph*0.04),1,Math.floor(ph*0.86));
            // Three shelves
            for(let s=0;s<3;s++){
              X.fillStyle='rgba(30,30,25,0.6)';
              X.fillRect(col,y0+Math.floor(ph*(0.04+s*0.28)),1,Math.floor(ph*0.04));
            }
            // Chrome rail at top
            if(dist<6){X.fillStyle='rgba(200,200,185,0.35)';X.fillRect(col,y0+Math.floor(ph*0.04),1,Math.floor(ph*0.04));}
            // Contents suggestion on shelves (close range)
            if(dist<4&&u>0.20&&u<0.80){
              X.fillStyle='rgba(220,215,190,0.25)';
              X.fillRect(col,y0+Math.floor(ph*0.10),1,Math.floor(ph*0.20));
            }
            // Wheels
            if(u>0.20&&u<0.80){X.fillStyle='#2a2a28';X.fillRect(col,y0+Math.floor(ph*0.88),1,Math.floor(ph*0.12));}
          }
        }

        // ── CRT MONITOR ────────────────────────────────────
        else if(subtype==='monitor'){
          if(u>0.18&&u<0.82){
            X.fillStyle='#72726a';X.fillRect(col,y0+Math.floor(ph*0.08),1,Math.floor(ph*0.80));
            if(u>0.22&&u<0.78){
              X.fillStyle='#484840';X.fillRect(col,y0+Math.floor(ph*0.10),1,Math.floor(ph*0.55));
              if(u>0.25&&u<0.75){
                // Dark screen — static noise tint
                X.fillStyle='#0a100a';X.fillRect(col,y0+Math.floor(ph*0.12),1,Math.floor(ph*0.50));
                if(dist<7){
                  // Green phosphor scanline glow
                  const scanH=Math.floor(ph*0.50);
                  const scanY=Math.floor(gameTime*14)%Math.max(1,scanH);
                  X.fillStyle='rgba(0,100,25,0.45)';X.fillRect(col,y0+Math.floor(ph*0.12)+scanY,1,2);
                  X.fillStyle='rgba(0,80,20,0.10)';X.fillRect(col,y0+Math.floor(ph*0.12),1,scanH);
                }
              }
            }
            // Stand base
            if(u>0.42&&u<0.58){X.fillStyle='#525248';X.fillRect(col,y0+Math.floor(ph*0.63),1,Math.floor(ph*0.30));}
          }
        }

        // ── DESK ───────────────────────────────────────────
        else if(subtype==='desk'){
          if(u>0.04&&u<0.96){
            X.fillStyle='#5e5040';X.fillRect(col,y0+Math.floor(ph*0.30),1,Math.floor(ph*0.70));
            if(u>0.06&&u<0.94){X.fillStyle='#6e6050';X.fillRect(col,y0+Math.floor(ph*0.30),1,Math.floor(ph*0.07));}
            if(u>0.06&&u<0.94){X.fillStyle='#4e4030';X.fillRect(col,y0+Math.floor(ph*0.50),1,Math.floor(ph*0.50));}
          }
        }

        // ── GHOST / SHADOW FIGURE ──────────────────────────
        // Barely-visible dark silhouette in doorways — blink of movement
        else if(subtype==='shadow_figure'){
          const gAlpha=Math.max(0,0.28-dist*0.028)*(0.7+Math.sin(gameTime*0.7)*0.3);
          if(gAlpha>0.01&&u>0.22&&u<0.78){
            X.globalAlpha=gAlpha;
            // Head
            if(u>0.36&&u<0.64){
              X.fillStyle='#0e0c18';X.fillRect(col,y0+Math.floor(ph*0.02),1,Math.floor(ph*0.16));
            }
            // Shoulders + body
            X.fillStyle='#0c0a14';
            X.fillRect(col,y0+Math.floor(ph*0.16),1,Math.floor(ph*0.58));
            // Arm left
            if(u>0.22&&u<0.34){X.fillRect(col,y0+Math.floor(ph*0.20),1,Math.floor(ph*0.42));}
            // Arm right
            if(u>0.66&&u<0.78){X.fillRect(col,y0+Math.floor(ph*0.20),1,Math.floor(ph*0.42));}
            // Very faint violet edge highlight — makes it feel ghostly
            if(u>0.35&&u<0.37||u>0.63&&u<0.65){
              X.fillStyle='rgba(80,60,120,0.4)';X.fillRect(col,y0+Math.floor(ph*0.02),1,Math.floor(ph*0.72));
            }
            X.globalAlpha=1;
          }
        }

      } // end col loop for props
    } else {
      const col2=type==='key'?'#ffdd44':type==='health'?'#44ff88':'#4488ff';
      const pu=(Math.sin(gameTime*3)+1)/2;
      const y0=Math.floor((RH-h*.5)/2);
      const ih=Math.floor(h*.5);
      for(let col=x0+Math.floor(w*.3);col<x0+Math.floor(w*.7);col++){
        if(col<0||col>=RW)continue;
        if(dist>zBuf[(col/Z_SCALE)|0])continue;
        X.fillStyle=col2;
        X.fillRect(col,y0,1,ih);
      }
      // Glow
      if(dist<3){
        X.globalAlpha=0.3+pu*.2;
        X.fillStyle=col2;
        X.fillRect(x0+Math.floor(w*.2),y0-1,Math.floor(w*.6),ih+2);
        X.globalAlpha=1;
      }
    }
  });  // end sprites.forEach

  // ── World-space blood decals (floor puddles) ──────────────────
  bloodDecals.forEach(b=>{
    const sp=projectSprite(b.wx,b.wy);
    if(!sp)return;
    const {screenX,dist}=sp;
    if(dist>zBuf[(screenX/Z_SCALE)|0])return;
    // Flat ellipse at floor level
    const floorY=Math.floor(RH/2 + Math.min(RH/2-2, RH/(dist*2.2)));
    const pw=Math.max(1,Math.floor(RH/(dist*1.8)));
    const ph=Math.max(1,Math.floor(pw*0.3));
    X.globalAlpha=b.a*0.85;
    X.fillStyle='#660000';
    X.beginPath();
    X.ellipse(screenX,floorY,pw,ph,0,0,Math.PI*2);
    X.fill();
    X.fillStyle='#440000';
    X.beginPath();
    X.ellipse(screenX,floorY,Math.max(1,pw-2),Math.max(1,ph-1),0,0,Math.PI*2);
    X.fill();
    X.globalAlpha=1;
  });
}
// ── Wall-mounted room signs / plaques ────────────────────────
function drawSigns(){
  const signs=(LEVELS[currentLevel].signDefs)||[];
  signs.forEach(sign=>{
    const sp=projectSprite(sign.wx,sign.wy);
    if(!sp)return;
    const {screenX,dist,h}=sp;
    if(dist<0.5||dist>14)return;

    // Plaque dimensions scale with wall height
    const pw=Math.floor(h*1.4);   // wide
    const ph=Math.floor(h*0.22);  // short — eye-level band
    const px=Math.floor(screenX-pw/2);
    const py=Math.floor(RH/2 - h*0.08); // just above horizon = eye level on wall

    // Occlusion — skip if something is closer in the middle column
    if(zBuf[Math.min(RAYS-1,Math.max(0,(screenX/Z_SCALE)|0))]<dist-0.3)return;

    // Draw plaque body — dark institutional green/wood
    const bgColor=sign.col||'#1a2e1a';
    X.fillStyle=bgColor;
    X.fillRect(px,py,pw,ph);

    // Lighter top trim edge
    X.fillStyle='rgba(255,255,255,0.12)';
    X.fillRect(px,py,pw,1);
    X.fillRect(px,py,1,ph);
    // Dark bottom shadow
    X.fillStyle='rgba(0,0,0,0.35)';
    X.fillRect(px,py+ph-1,pw,1);

    // Text — scale font by dist, keep sharp PS1 style
    const fs=Math.max(3,Math.floor(10/dist));
    X.font=`bold ${fs}px monospace`;
    X.textAlign='center';

    // Handle newlines
    const lines=sign.label.split('\n');
    const lineH=fs+2;
    const totalH=lines.length*lineH;
    const startY=py+Math.floor((ph-totalH)/2)+fs;

    // Shadow
    X.fillStyle='rgba(0,0,0,0.7)';
    lines.forEach((ln,i)=>X.fillText(ln,screenX+1,startY+i*lineH+1));
    // Main text — off-white brass-look
    X.fillStyle='#e8dfa8';
    lines.forEach((ln,i)=>X.fillText(ln,screenX,startY+i*lineH));
  });
}

function drawFlashlight(){

    vg.addColorStop(0,'rgba(0,0,0,0)');

}

// ── HUD ───────────────────────────────────────────────────────
function drawHUD(){
  const BAR_W=180, BAR_H=20, BAR_X=14, FONT='bold 16px monospace';

  // ── Health bar ──────────────────────────────────────────────
  const hpPct=player.health/player.maxHealth;
  const hpCol=hpPct>0.5?'#22cc44':hpPct>0.25?'#ccaa00':'#cc2222';
  X.fillStyle='rgba(0,0,0,.7)';  X.fillRect(BAR_X-2,RH-BAR_H*2-32,BAR_W+4,BAR_H+4);
  X.fillStyle=hpCol;              X.fillRect(BAR_X,  RH-BAR_H*2-30,Math.floor(BAR_W*hpPct),BAR_H);
  X.strokeStyle='rgba(255,255,255,.4)'; X.lineWidth=1.5;
  X.strokeRect(BAR_X-2,RH-BAR_H*2-32,BAR_W+4,BAR_H+4);
  X.font=FONT; X.fillStyle='#fff'; X.textAlign='left';
  X.fillText(`HP  ${player.health}`,BAR_X,RH-BAR_H*2-36);

  // ── Flashlight bar ──────────────────────────────────────────
  const batPct=flashlight.battery/100;
  const batCol=batPct>0.4?'#4488ff':batPct>0.2?'#9944ff':'#ff4444';
  X.fillStyle='rgba(0,0,0,.7)';  X.fillRect(BAR_X-2,RH-BAR_H-8,BAR_W+4,BAR_H+4);
  X.fillStyle=batCol;             X.fillRect(BAR_X,  RH-BAR_H-6,Math.floor(BAR_W*batPct),BAR_H);
  X.strokeStyle='rgba(255,255,255,.4)'; X.strokeRect(BAR_X-2,RH-BAR_H-8,BAR_W+4,BAR_H+4);
  X.font=FONT; X.fillStyle='#aaaaff'; X.textAlign='left';
  X.fillText('LIGHT',BAR_X,RH-BAR_H-12);

  // ── Key indicator ───────────────────────────────────────────
  if(player.hasKey){
    X.fillStyle='rgba(0,0,0,.7)'; X.fillRect(BAR_X,RH-BAR_H*3-54,100,26);
    X.fillStyle='#ffdd44'; X.font='bold 18px monospace'; X.textAlign='left';
    X.fillText('🔑  KEY',BAR_X+6,RH-BAR_H*3-36);
  }

  // ── Score + level top-right ─────────────────────────────────
  X.font='bold 18px monospace'; X.textAlign='right';
  X.fillStyle='rgba(0,0,0,.7)'; X.fillRect(RW-240,6,234,50);
  X.fillStyle='#ffdd44'; X.fillText(`SCORE  ${score}`,RW-10,28);
  X.fillStyle='#ff9944'; X.fillText(`LV ${currentLevel+1}  ${LEVELS[currentLevel].name}`,RW-10,50);

  // ── Crosshair ───────────────────────────────────────────────
  const cx=RW/2, cy=RH/2;
  const enemyClose=enemies.some(e=>e.state!=='dead'&&Math.hypot(e.x-player.x,e.y-player.y)<2.2);
  const chCol=enemyClose?'rgba(255,50,50,.95)':'rgba(255,255,255,.75)';
  X.strokeStyle=chCol; X.lineWidth=2.5;
  X.beginPath(); X.moveTo(cx-14,cy); X.lineTo(cx-5,cy); X.stroke();
  X.beginPath(); X.moveTo(cx+5, cy); X.lineTo(cx+14,cy); X.stroke();
  X.beginPath(); X.moveTo(cx,cy-14); X.lineTo(cx,cy-5);  X.stroke();
  X.beginPath(); X.moveTo(cx,cy+5);  X.lineTo(cx,cy+14); X.stroke();
  if(enemyClose){
    X.strokeStyle='rgba(255,50,50,.5)'; X.lineWidth=2;
    X.beginPath(); X.arc(cx,cy,10,0,Math.PI*2); X.stroke();
  }

  // ── GoldenEye gun ───────────────────────────────────────────
  const bobY=Math.sin(weaponBobT)*8*weaponBobAmt;
  const bobX=Math.sin(weaponBobT*0.5)*5*weaponBobAmt;
  const gx=RW-160+bobX+weaponSway*6;
  const gy=RH-96+bobY-weaponKick*2.5;

  X.save();
  X.translate(gx,gy);
  X.scale(3.2,3.2);

  // Shadow
  X.fillStyle='rgba(0,0,0,.5)'; X.fillRect(2,5,80,35);
  // Silencer
  X.fillStyle='#484848'; X.fillRect(46,4,36,11);
  X.fillStyle='#888';    X.fillRect(46,4,36,3);
  X.fillStyle='#666';    X.fillRect(46,7,36,2);
  X.fillStyle='#222';    X.fillRect(46,13,36,2);
  X.fillStyle='#333';    X.fillRect(80,3,4,13);
  X.fillStyle='#555';    X.fillRect(80,3,4,3);
  X.fillStyle='#383838';
  for(let r=0;r<4;r++) X.fillRect(51+r*8,4,1,11);
  // Slide
  X.fillStyle='#a0a8b0';
  X.beginPath(); X.moveTo(16,8); X.lineTo(50,8); X.lineTo(50,20); X.lineTo(16,20); X.closePath(); X.fill();
  X.fillStyle='#c8d0d8'; X.fillRect(18,8,28,4);
  X.fillStyle='#606870'; X.fillRect(18,17,28,3);
  X.fillStyle='#484858';
  for(let s=0;s<5;s++) X.fillRect(20+s*4,9,2,8);
  X.fillStyle='#282830'; X.fillRect(36,9,8,7);
  // Frame
  X.fillStyle='#2a2e32';
  X.beginPath(); X.moveTo(20,20); X.lineTo(46,20); X.lineTo(44,38); X.lineTo(18,38); X.closePath(); X.fill();
  X.fillStyle='#1a1e22'; X.fillRect(30,22,12,14);
  X.fillStyle='rgba(0,0,0,0.3)';
  for(let g=0;g<3;g++) for(let r=0;r<4;r++) X.fillRect(22+g*5,24+r*3,3,2);
  X.strokeStyle='#383838'; X.lineWidth=1.5;
  X.beginPath(); X.moveTo(28,20); X.quadraticCurveTo(22,28,26,34); X.stroke();
  // Muzzle flash
  if(attackFlash>0){
    const f=attackFlash/8;
    X.fillStyle=`rgba(255,220,80,${f*0.9})`;
    X.beginPath(); X.arc(82,9,6*f,0,Math.PI*2); X.fill();
    X.fillStyle=`rgba(255,255,200,${f*0.7})`;
    X.beginPath(); X.arc(82,9,3*f,0,Math.PI*2); X.fill();
  }
  X.restore();

  // ── Minimap ─────────────────────────────────────────────────
  drawMinimap();

  // ── Damage flash ────────────────────────────────────────────
  if(damageFlash>0){
    X.fillStyle=`rgba(180,0,0,${damageFlash*0.018})`;
    X.fillRect(0,0,RW,RH);
  }
}

function drawMinimap(){
  const ms=7, ox=RW-MAPW*ms-14, oy=14;
  X.fillStyle='rgba(0,0,0,.8)'; X.fillRect(ox-3,oy-3,MAPW*ms+6,MAPH*ms+6);
  for(let my=0;my<MAPH;my++){
    for(let mx=0;mx<MAPW;mx++){
      const v=MAP[my][mx];
      if(v===0)continue;
      X.fillStyle=v===1?'#2a2a2a':v===2?'#622222':v===3?'#224422':v===6?'#1a4030':v===7?'#4a4020':v===8?'#1a2840':'#333';
      X.fillRect(ox+mx*ms,oy+my*ms,ms,ms);
    }
  }
  items.forEach(it=>{
    if(!it.alive)return;
    X.fillStyle=it.type==='key'?'#ffdd44':'#44ff88';
    X.fillRect(ox+Math.floor(it.x)*ms+1,oy+Math.floor(it.y)*ms+1,ms-1,ms-1);
  });
  enemies.forEach(e=>{
    if(e.state==='dead')return;
    X.fillStyle=e.state==='chase'?'#ff4444':'#882222';
    X.fillRect(ox+Math.floor(e.x)*ms+1,oy+Math.floor(e.y)*ms+1,ms-1,ms-1);
  });
  const px=ox+player.x*ms, py=oy+player.y*ms;
  X.fillStyle='#55aaff'; X.fillRect(px-2,py-2,6,6);
  X.strokeStyle='#55aaff'; X.lineWidth=2;
  X.beginPath(); X.moveTo(px+1,py+1);
  X.lineTo(px+1+Math.cos(player.angle)*11,py+1+Math.sin(player.angle)*11);
  X.stroke();
}

function drawMessages(){
  if(msgTimer>0&&msgText){
    const a=Math.min(1,msgTimer);
    X.globalAlpha=a;
    X.font='bold 16px monospace'; X.textAlign='center';
    X.fillStyle='rgba(0,0,0,.7)'; X.fillRect(RW/2-90,8,180,24);
    X.fillStyle='#ffffaa'; X.fillText(msgText,RW/2,26);
    X.globalAlpha=1;
  }

  items.forEach(it=>{
    if(!it.alive)return;
    if(Math.hypot(it.x-player.x,it.y-player.y)<1.5){
      const pulse=(Math.sin(gameTime*6)+1)/2;
      X.globalAlpha=0.5+pulse*0.45;
      X.font='bold 15px monospace'; X.textAlign='center';
      X.fillStyle='rgba(0,0,0,.65)'; X.fillRect(RW/2-100,RH/2+16,200,22);
      X.fillStyle='#ffdd88';
      X.fillText(it.type==='key'?'▶ KEY — WALK OVER':'▶ MEDS — WALK OVER',RW/2,RH/2+32);
      X.globalAlpha=1;
    }
  });

  if(mapAt(Math.floor(player.x+Math.cos(player.angle)),Math.floor(player.y+Math.sin(player.angle)))===3||
     mapAt(player.x,player.y)===3){
    X.font='bold 16px monospace'; X.textAlign='center';
    X.fillStyle='rgba(0,0,0,.65)'; X.fillRect(RW/2-60,RH/2+16,120,22);
    X.fillStyle='#44ff88'; X.fillText('EXIT!',RW/2,RH/2+32);
  }
}

// ── VHS / noise overlay ───────────────────────────────────────
function drawVHS(){
  // Scanlines
  for(let y=0;y<RH;y+=2){
    X.fillStyle='rgba(0,0,0,.08)';X.fillRect(0,y,RW,1);
  }
  // Chromatic aberration strip (rare)
  if(Math.random()<0.04){
    const sy=Math.floor(Math.random()*RH);
    X.globalAlpha=0.15;
    X.fillStyle='rgba(255,0,0,.5)';X.fillRect(0,sy,RW,1);
    X.fillStyle='rgba(0,0,255,.5)';X.fillRect(2,sy,RW,1);
    X.globalAlpha=1;

  // Occasional full noise line
  if(Math.random()<0.02){
    const sy=Math.floor(Math.random()*RH);
    X.fillStyle=`rgba(255,255,255,${Math.random()*.08})`;
    X.fillRect(0,sy,RW,1);
  }
}

  X.font='16px monospace'; X.fillStyle='#336644';
  X.fillText('You made it out of Hilyard Street.',RW/2,RH/2+30);
  X.fillText('You never found your sister.',RW/2,RH/2+52);
  X.fillStyle='#ffdd44'; X.font='bold 16px monospace';
  X.fillText(`Score: ${score}    Kills: ${kills}`,RW/2,RH/2+76);
  const pu=(Math.sin(Date.now()/600)+1)/2;
  X.globalAlpha=.4+pu*.55;
  X.font='bold 18px monospace'; X.fillStyle='#448855';
  X.fillText('CLICK TO PLAY AGAIN',RW/2,RH/2+108);
  X.globalAlpha=1;
  drawVHS();
}

function drawIntro(){
  X.fillStyle='rgba(0,0,0,.88)'; X.fillRect(0,0,RW,RH);
  const lv=LEVELS[currentLevel];
  X.textAlign='center';
  X.font='18px monospace';       X.fillStyle='#ccbbaa'; X.fillText('You open your eyes.',RW/2,RH*0.18);
  X.font='bold 38px monospace';  X.fillStyle='#ffdd44'; X.fillText(`LEVEL ${currentLevel+1}`,RW/2,RH*0.30);
  X.font='bold 22px monospace';  X.fillStyle='#cc8844'; X.fillText(lv.name,RW/2,RH*0.40);
  X.fillStyle='#332211'; X.fillRect(RW/2-80,RH*0.44,160,2);
  X.font='bold 16px monospace';  X.fillStyle='#cc6644';
  X.fillText(`${lv.enemyDefs.length} creatures patrol these halls.`,RW/2,RH*0.52);
  X.font='16px monospace';       X.fillStyle='#ccaa66';
  X.fillText('Find the KEY.  Unlock the door.  Reach the EXIT.',RW/2,RH*0.60);
  X.fillStyle='#332211'; X.fillRect(RW/2-80,RH*0.65,160,2);
  X.font='15px monospace';       X.fillStyle='#7799bb';
  X.fillText('W A S D / Arrow Keys — Move & Turn',RW/2,RH*0.72);
  X.fillText('CLICK / SPACE — Shoot',RW/2,RH*0.79);
  const pu=(Math.sin(Date.now()/500)+1)/2;
  X.globalAlpha=.45+pu*.5;
  X.font='bold 18px monospace';  X.fillStyle='#997755';
  X.fillText('▶  CLICK or SPACE to begin  ◀',RW/2,RH*0.90);
  X.globalAlpha=1;
}

function drawPause(){
  X.fillStyle='rgba(0,0,0,.72)'; X.fillRect(0,0,RW,RH);
  X.textAlign='center';
  X.font='bold 52px monospace'; X.fillStyle='#aa8866'; X.fillText('PAUSED',RW/2,RH/2);
  X.font='18px monospace';      X.fillStyle='#665544'; X.fillText('P  —  resume',RW/2,RH/2+40);
}

requestAnimationFrame(ts=>{lt=ts;requestAnimationFrame(loop);});
</script>
</body>
</html>
