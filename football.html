<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Coach Johnson's Football USA – Smart Resume Format</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>

    :root { --accent:#1e3a5f; --accent2:#c9963a; }
    body { font-family:'DM Sans',sans-serif; background:#111;
           -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }

          padding:1.2rem 5%; background:var(--accent); position:sticky; top:0; z-index:200; }
    .logo { font-family:'Playfair Display',serif; font-size:1.3rem; color:#fff; font-weight:700; }
    .nav-btn { background:var(--accent2); color:#fff; padding:.5rem 1.3rem;
                text-decoration:none; border-radius:6px; font-weight:600; font-size:.9rem; }

    .game-title { font-family:'Press Start 2P',monospace; color:#ffd700;
                  font-size:clamp(.55rem,2.2vw,1rem); text-shadow:2px 2px 0 #7a6000;
                  text-align:center; margin-bottom:.5rem; }
    #gameCanvas { display:block; width:100%; max-width:900px; height:auto;
                  border:3px solid #1e3a5f; touch-action:none; cursor:crosshair; }
    footer { text-align:center; padding:2rem; background:#1c1917; color:#78716c; font-size:.88rem; }
    footer a { color:#a8a29e; margin:0 10px; text-decoration:none; }
    footer a:hover { color:var(--accent2); }
    .footer-links { margin-bottom:1rem; }
  </style>

<nav>
  <div class="logo">Smart Resume Format</div>
  <a href="https://smartresumeformat.pythonanywhere.com" class="nav-btn">Start Building</a>
</nav>

<div class="game-wrapper">
  <div class="game-title">COACH JOHNSON'S FOOTBALL USA</div>
  <canvas id="gameCanvas" width="900" height="520"></canvas>
</div>

<footer>
  <div class="footer-links">
    <a href="privacy.html">Privacy Policy</a> |
    <a href="terms.html">Terms of Service</a> |
    <a href="support.html">Support</a>
  </div>
  <p>&copy; 2026 Smart Resume Format. All rights reserved.</p>
</footer>

<script>
/* ═══════════════════════════════════════════════════════════════
   COACH JOHNSON'S FOOTBALL USA

   KEYBOARD CONTROLS
   ─────────────────
   Play select screen :  1 / 2 / 3 / 4  — pick a play
   Before snap        :  SPACE           — hike the ball
   Running            :  W A S D         — steer ball carrier
   Passing (QB mode)  :  W A S D         — move QB in pocket
                         J / K / L       — throw to receiver J, K, or L
                                           (letter floats above their head)

   MOBILE
   ──────
   Tap play card   — pick play
   Tap anywhere    — hike
   Drag            — move player / QB
   Tap a receiver  — throw to them
═══════════════════════════════════════════════════════════════ */

const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const CW=900, CH=520;

// ── Field ─────────────────────────────────────────────────────
const FTOP=118, FBOT=490, FMID=(118+490)/2, FH=490-118;
const PPY=10, EZ=10;

// ── Colours ───────────────────────────────────────────────────
const NY_BLUE='#0B2265', NY_RED='#A71930';
const CPU_F='#4a0000', CPU_A='#ff5555';
const FG='#2d5a27', FA2='#345e2c';

// ── States ────────────────────────────────────────────────────
const S={ TITLE:'title', SEL:'sel', READY:'ready', SNAP:'snap',
          RUN:'run', PASS:'pass', AIR:'air',
          INTERCEPT:'intercept',
          RES:'res', TD:'td', CPU:'cpu', OVER:'over' };
let state=S.TITLE;

// ── Game vars ─────────────────────────────────────────────────
let score, down, ytg, yl, quarter, clock, stTimer, camX;
let resultMsg, resultSub, selPlay;
let offense=[], defense=[], ballCarrier=null;
let passRcvrs=[];   // receivers labelled 1,2,3 during pass plays
let ball={};
let snapTimer=0;
let interceptor=null;
let consecutiveRuns=0;  // tightens defense if player keeps running

// ── Plays ─────────────────────────────────────────────────────
const PLAYS=[
  { name:'RUN LEFT',   sub:'Hand off — dodge left',    type:'run',  dir:-1, col:'#ff9966' },
  { name:'RUN RIGHT',  sub:'Hand off — power right',   type:'run',  dir: 1, col:'#ffcc66' },
  { name:'PASS SHORT', sub:'Quick slant / TE route',   type:'pass', rng:'short', col:'#66ccff' },
  { name:'PASS LONG',  sub:'Bomb downfield',           type:'pass', rng:'long',  col:'#bb88ff' },
];

// ════════════════════════════════════════════════════════════════
//  KEYBOARD
// ════════════════════════════════════════════════════════════════
const K={};
window.addEventListener('keydown', e=>{
  if(!K[e.code]){ K[e.code]=true; onPress(e.code); }
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
    e.preventDefault();
});
window.addEventListener('keyup', e=>{ K[e.code]=false; });

function onPress(c){
  if(state===S.TITLE||state===S.OVER){ beginGame(); return; }

  if(state===S.SEL){
    if(c==='Digit1') pickPlay(0);
    if(c==='Digit2') pickPlay(1);
    if(c==='Digit3') pickPlay(2);
    if(c==='Digit4') pickPlay(3);
    return;
  }

  if(state===S.READY && c==='Space'){ doSnap(); return; }

  // During pass play: J/K/L throw to receivers (right hand, WASD left hand)
  if(state===S.PASS){
    if(c==='KeyJ') doThrowTo(0);
    if(c==='KeyK') doThrowTo(1);
    if(c==='KeyL') doThrowTo(2);
  }
}

// ════════════════════════════════════════════════════════════════
//  TOUCH
// ════════════════════════════════════════════════════════════════
const T={ active:false, id:-1, sx:0, sy:0, cx:0, cy:0, t0:0 };
const JR=60, JDEAD=14;

function toCv(clientX,clientY){
  const r=canvas.getBoundingClientRect();
  return { x:(clientX-r.left)*(CW/r.width), y:(clientY-r.top)*(CH/r.height) };
}

canvas.addEventListener('touchstart', e=>{
  e.preventDefault();
  const t=e.changedTouches[0], p=toCv(t.clientX,t.clientY);
  if(state===S.TITLE||state===S.OVER){ beginGame(); return; }
  if(state===S.SEL){ tapPlayCard(p.x,p.y); return; }
  if(state===S.READY){ doSnap(); return; }
  if(!T.active){
    Object.assign(T,{active:true,id:t.identifier,sx:p.x,sy:p.y,cx:p.x,cy:p.y,t0:Date.now()});
  }
},{passive:false});

canvas.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==T.id) continue;
    const p=toCv(t.clientX,t.clientY);
    T.cx=p.x; T.cy=p.y;
  }
},{passive:false});

canvas.addEventListener('touchend', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==T.id) continue;
    const drag=Math.hypot(T.cx-T.sx,T.cy-T.sy);
    const isTap=Date.now()-T.t0<300&&drag<22;
    if(isTap && state===S.PASS){
      // Find closest receiver to tap point (world coords)
      const tapWX=T.sx+camX-CW/2;
      let best=-1, bestD=Infinity;
      passRcvrs.forEach((r,i)=>{
        const d=Math.hypot(r.x-tapWX,r.y-T.sy);
        if(d<bestD){ bestD=d; best=i; }
      });
      if(best>=0 && bestD<80) doThrowTo(best);
      else if(passRcvrs.length) doThrowTo(0); // fallback: throw to #1
    }
    T.active=false; T.id=-1;
  }
},{passive:false});

// Mouse fallback
canvas.addEventListener('click', e=>{
  const p=toCv(e.clientX,e.clientY);
  if(state===S.TITLE||state===S.OVER){ beginGame(); return; }
  if(state===S.SEL){ tapPlayCard(p.x,p.y); return; }
  if(state===S.READY){ doSnap(); return; }
});

// Joystick vector from touch
function joyVec(){
  if(!T.active) return {x:0,y:0};
  const dx=T.cx-T.sx, dy=T.cy-T.sy, d=Math.hypot(dx,dy);
  if(d<JDEAD) return {x:0,y:0};
  const s=Math.min(d,JR)/JR;
  return {x:dx/d*s, y:dy/d*s};
}

function tapPlayCard(cx,cy){
  playCardRects().forEach((r,i)=>{
    if(cx>=r.x&&cx<=r.x+r.w&&cy>=r.y&&cy<=r.y+r.h) pickPlay(i);
  });
}

// ════════════════════════════════════════════════════════════════
//  SETUP
// ════════════════════════════════════════════════════════════════
function beginGame(){
  score={ny:0,cpu:0}; down=1; ytg=10; yl=20; quarter=1; clock=180;
  goSelect();
}

function goSelect(){
  state=S.SEL; selPlay=null; buildFormation();
}

function buildFormation(){
  const bwx=(EZ+yl)*PPY;
  ball={x:bwx,y:FMID,vx:0,vy:0,air:false,rcv:null};
  camX=bwx; ballCarrier=null;
  const cx=bwx, cy=FMID;

  offense=[
    mkO(cx,    cy,    'c', '52', 0,   false),
    mkO(cx-30, cy,    'qb','10', 1.9, true ),
    mkO(cx-20, cy,    'hb','27', 2.5, false),
    mkO(cx+16, cy-78, 'wr','17', 2.7, false, cx+150,cy-78),
    mkO(cx+16, cy+78, 'wr','88', 2.7, false, cx+195,cy+78),
    mkO(cx+14, cy-30, 'te','82', 2.1, false, cx+90, cy-30),
  ];
  defense=[
    mkD(cx+80,  cy,    'dt','90', 1.3),
    mkD(cx+95,  cy-40, 'de','95', 1.5),
    mkD(cx+95,  cy+40, 'de','91', 1.5),
    mkD(cx+155, cy-78, 'cb','23', 1.85),
    mkD(cx+155, cy+78, 'cb','41', 1.85),
    mkD(cx+125, cy,    'lb','55', 1.65),
  ];
  // Receivers labelled 1,2,3 for pass plays
  passRcvrs=offense.filter(p=>p.role==='wr'||p.role==='te');
  ballCarrier=offense.find(p=>p.ctrl)||null;
}

function mkO(x,y,role,num,spd,ctrl,rtx,rty){
  return {x,y,vx:0,vy:0,role,num,spd,ctrl,tackled:false,
          rtx:rtx??x,rty:rty??y,isQB:role==='qb'};
}
function mkD(x,y,role,num,spd){
  return {x,y,vx:0,vy:0,role,num,spd,tackled:false};
}

// ════════════════════════════════════════════════════════════════
//  PLAY ACTIONS
// ════════════════════════════════════════════════════════════════
function pickPlay(i){
  if(state!==S.SEL) return;
  selPlay=PLAYS[i];
  if(selPlay.type==='run') consecutiveRuns++;
  else consecutiveRuns=0;
  if(selPlay.rng==='long'){
    offense.find(p=>p.num==='17').rtx+=70;
    offense.find(p=>p.num==='88').rtx+=90;
    offense.find(p=>p.num==='82').rtx+=40;
  }
  state=S.READY;
}

function doSnap(){
  if(state!==S.READY) return;
  state=S.SNAP; snapTimer=0.38;
}

// Throw to receiver by index (0=1, 1=2, 2=3)
function doThrowTo(idx){
  if(state!==S.PASS) return;
  const tgt=passRcvrs[idx];
  if(!tgt||tgt.tackled){
    // Try next open receiver
    const open=passRcvrs.find(r=>!r.tackled);
    if(!open){ endPlay(0); return; }
    idx=passRcvrs.indexOf(open);
    return doThrowTo(idx);
  }
  const qb=offense.find(p=>p.isQB);
  const isLong = selPlay && selPlay.rng==='long';
  // Long throws have a 28% chance of being off-target — sails over or falls short
  if(isLong && Math.random()<0.28){
    ball.x=qb.x; ball.y=qb.y; ball.air=true; ball.rcv=null;
    const dx=tgt.x-qb.x, dy=tgt.y-qb.y, d=Math.hypot(dx,dy)||1;
    // Overthrow or underthrow — offset the destination
    const miss=(Math.random()<0.5?1:-1)*(30+Math.random()*40);
    ball.vx=(dx/d + miss/200)*9; ball.vy=dy/d*9;
    qb.ctrl=false; ballCarrier=null;
    state=S.AIR;
    return;
  }
  ball.x=qb.x; ball.y=qb.y; ball.air=true; ball.rcv=tgt;
  const dx=tgt.x-qb.x, dy=tgt.y-qb.y, d=Math.hypot(dx,dy)||1;
  ball.vx=dx/d*9; ball.vy=dy/d*9;
  qb.ctrl=false; ballCarrier=null;
  state=S.AIR;
}

// ════════════════════════════════════════════════════════════════
//  LOOP
// ════════════════════════════════════════════════════════════════
let lastT=0;
function loop(ts){
  const dt=Math.min((ts-lastT)/1000,.05); lastT=ts;
  update(dt); render();
  requestAnimationFrame(loop);
}

function update(dt){
  if([S.RUN,S.PASS,S.AIR].includes(state)) clock=Math.max(0,clock-dt);

  if(state===S.SNAP){
    snapTimer-=dt;
    if(snapTimer<=0){
      if(selPlay.type==='run'){
        const hb=offense.find(p=>p.role==='hb');
        offense.find(p=>p.isQB).ctrl=false;
        hb.ctrl=true;
        // Always burst rightward (toward end zone) — player steers from there
        hb.vx=2.8; hb.vy=selPlay.dir*0.8;
        ballCarrier=hb; ball.x=hb.x; ball.y=hb.y;
        state=S.RUN;
      } else {
        // Pass: QB keeps ball, player moves him and picks a numbered receiver to throw to
        state=S.PASS;
      }
    }
    return;
  }

  if(state===S.RUN||state===S.PASS){
    moveCarrier(dt);
    moveReceivers();
    moveDef();
    checkTackle();
    syncCam();
    checkTD();
    if(clock<=0) endPlay(getGained());
  }

  if(state===S.AIR){
    moveBall();
    moveReceivers();
    moveDef();
    syncCam();
    if(clock<=0) endPlay(0);
  }

  if(state===S.INTERCEPT){
    moveInterceptor();
    syncCam();
  }

  if([S.RES,S.CPU,S.TD].includes(state)){
    stTimer-=dt;
    if(stTimer<=0){
      if(state===S.TD){
        advQ();
        if(state!==S.OVER){ cpuTurn(); }  // CPU gets ball after every TD
      }
      else if(state===S.CPU){ showNextCpuLine(); }
      else goSelect();
    }
  }
}

// WASD + joystick unified movement
function moveCarrier(){
  if(!ballCarrier||ballCarrier.tackled) return;
  let mx=0,my=0;
  if(K.KeyA||K.ArrowLeft)  mx=-1;
  if(K.KeyD||K.ArrowRight) mx= 1;
  if(K.KeyW||K.ArrowUp)    my=-1;
  if(K.KeyS||K.ArrowDown)  my= 1;
  const j=joyVec();
  if(!mx&&!my&&(j.x||j.y)){ mx=j.x; my=j.y; }
  const m=Math.hypot(mx,my)||1;
  if(mx||my){ ballCarrier.vx=mx/m*ballCarrier.spd; ballCarrier.vy=my/m*ballCarrier.spd; }
  else { ballCarrier.vx*=.62; ballCarrier.vy*=.62; }
  ballCarrier.x+=ballCarrier.vx;
  ballCarrier.y=clamp(ballCarrier.y+ballCarrier.vy,FTOP+14,FBOT-14);
  ball.x=ballCarrier.x; ball.y=ballCarrier.y;
}

function moveReceivers(){
  offense.filter(p=>(p.role==='wr'||p.role==='te')&&!p.tackled&&p!==ballCarrier).forEach(r=>{
    const dx=r.rtx-r.x, dy=r.rty-r.y, d=Math.hypot(dx,dy)||1;
    if(d>2){ r.x+=dx/d*r.spd; r.y+=dy/d*r.spd; }
    else { r.x=r.rtx; r.y=r.rty; }
  });
}

function moveDef(){
  defense.forEach(def=>{
    if(def.tackled) return;

    const isLineman = def.role==='dt'||def.role==='de';
    const isLB      = def.role==='lb';
    const isCB      = def.role==='cb';

    // How aggressively defense reads run vs pass
    const runBias = Math.min(consecutiveRuns * 0.18, 0.7);

    let tx, ty;

    if(state===S.RUN){
      // Project where runner is heading — take a pursuit angle ahead of them
      const lead = isLineman ? 6 : isCB ? 22 : 14;
      tx = ball.x + (ballCarrier?.vx||0) * lead;
      ty = ball.y + (ballCarrier?.vy||0) * lead;
      // If runner is past the defender already, chase directly
      if(ball.x > def.x) { tx=ball.x; ty=ball.y; }
    } else if(state===S.PASS){
      // Pass rush: linemen go to QB, LBs/CBs cover receivers
      if(isLineman){
        tx=ball.x; ty=ball.y;
      } else {
        // Spy nearest receiver
        let nearest=null, nd=Infinity;
        passRcvrs.forEach(r=>{ const d=Math.hypot(r.x-def.x,r.y-def.y); if(d<nd){nd=d;nearest=r;} });
        tx=nearest?nearest.x:ball.x; ty=nearest?nearest.y:ball.y;
      }
    } else if(state===S.AIR){
      // Ball in flight — defenders hold their coverage position near their assigned receiver
      // They do NOT sprint at the ball. Only if the ball flies right past them can they pick it off.
      if(isLineman){
        // Linemen just slow down — they're not involved in pass coverage
        tx=def.x; ty=def.y;
      } else {
        // Stay near their closest receiver — no wild sprinting at the ball
        let nearest=null, nd=Infinity;
        passRcvrs.forEach(r=>{ const d=Math.hypot(r.x-def.x,r.y-def.y); if(d<nd){nd=d;nearest=r;} });
        tx=nearest?nearest.x:def.x; ty=nearest?nearest.y:def.y;
      }

    } else {
      tx=ball.x; ty=ball.y;
    }
    // Speed boost if defense expects run
    const boost = (state===S.RUN && !isLineman) ? 1+runBias : 1;
    const noise = 0.9+Math.random()*.18;
    const dx=tx-def.x, dy=ty-def.y, d=Math.hypot(dx,dy)||1;
    def.x+=dx/d*def.spd*boost*noise;
    def.y+=dy/d*def.spd*boost*noise;
  });
}

function checkTackle(){
  if(!ballCarrier||ballCarrier.tackled) return;
  defense.forEach(def=>{
    if(Math.hypot(def.x-ballCarrier.x,def.y-ballCarrier.y)<16){
      ballCarrier.tackled=true; endPlay(getGained());
    }
  });
}

function moveBall(){
  ball.x+=ball.vx; ball.y+=ball.vy;
  if(!ball.rcv) return;
  const rcv=ball.rcv;
  // Close enough to receiver = caught
  if(Math.hypot(ball.x-rcv.x,ball.y-rcv.y)<55){
    rcv.ctrl=true; rcv.vx=0; rcv.vy=0;
    ballCarrier=rcv;
    ball.x=rcv.x; ball.y=rcv.y; ball.air=false;
    ball.rcv=null;
    state=S.RUN;
    return;
  }
  // Ball flew past target area with no catch = incomplete
  const pastTarget=ball.vx>0
    ? ball.x > rcv.rtx+40
    : ball.x < rcv.rtx-40;
  if(pastTarget){ ball.air=false; ball.rcv=null; endPlay(0); return; }
  // Defender interception — only CBs and LBs in coverage, ball must fly right past them
  defense.filter(d=>d.role==='cb'||d.role==='lb').forEach(def=>{
    if(def.tackled||!ball.air) return;
    if(Math.hypot(def.x-ball.x,def.y-ball.y)<11){
      ball.air=false; ball.rcv=null;
      interceptor=def;
      interceptor.hasball=true;
      ball.x=def.x; ball.y=def.y;
      state=S.INTERCEPT;
    }
  });
}

function moveInterceptor(){
  if(!interceptor) return;

  // Player controls the QB to make the tackle
  const qb = offense.find(p=>p.isQB);
  if(qb && !qb.tackled){
    let mx=0, my=0;
    if(K.KeyA||K.ArrowLeft)  mx=-1;
    if(K.KeyD||K.ArrowRight) mx= 1;
    if(K.KeyW||K.ArrowUp)    my=-1;
    if(K.KeyS||K.ArrowDown)  my= 1;
    const j=joyVec();
    if(!mx&&!my&&(j.x||j.y)){ mx=j.x; my=j.y; }
    const m=Math.hypot(mx,my)||1;
    if(mx||my){ qb.vx=mx/m*2.2; qb.vy=my/m*2.2; }
    else { qb.vx*=.62; qb.vy*=.62; }
    qb.x+=qb.vx;
    qb.y=clamp(qb.y+qb.vy, FTOP+14, FBOT-14);
  }

  // Rest of offense auto-chases interceptor
  offense.filter(p=>!p.isQB&&!p.tackled).forEach(p=>{
    const dx=interceptor.x-p.x, dy=interceptor.y-p.y, d=Math.hypot(dx,dy)||1;
    p.x+=dx/d*p.spd*(0.8+Math.random()*.2);
    p.y+=dy/d*p.spd*(0.8+Math.random()*.2);
  });

  // Interceptor runs toward CPU end zone (left)
  interceptor.x -= 2.0;
  ball.x = interceptor.x; ball.y = interceptor.y;
  camX += (interceptor.x - camX) * .06;

  // Pick-six?
  if(interceptor.x <= EZ*PPY){
    score.cpu+=7; state=S.TD; stTimer=3.5;
    resultMsg='PICK SIX!'; resultSub='CPU SCORES  +7';
    interceptor.hasball=false; interceptor=null;
    return;
  }

  // Any offense player tackles interceptor
  offense.forEach(p=>{
    if(p.tackled||!interceptor) return;
    if(Math.hypot(p.x-interceptor.x,p.y-interceptor.y)<18){
      interceptor.hasball=false; interceptor=null;
      down=1; ytg=10;
      cpuTurn();
    }
  });
}

function checkTD(){
  if(!ballCarrier||ballCarrier.tackled) return;
  if(ballCarrier.x>=(EZ+100)*PPY){
    score.ny+=7; state=S.TD; stTimer=3;
    consecutiveRuns=0;
    resultMsg='TOUCHDOWN!'; resultSub='NEW YORK SCORES  +7';
  }
}

function getGained(){
  const o=(EZ+yl)*PPY;
  return Math.round(((ballCarrier||{x:o}).x-o)/PPY);
}

function endPlay(raw){
  if([S.RES,S.TD,S.CPU,S.OVER].includes(state)) return;
  state=S.RES; stTimer=2.5;
  const newYl=clamp(yl+raw,1,99);
  const gained=newYl-yl; yl=newYl;
  if(gained>=ytg){
    down=1; ytg=10;
    resultMsg=gained>0?`+${gained} YARDS`:'NO GAIN';
    resultSub='1ST DOWN!  ›';
  } else {
    ytg-=gained; down++;
    resultMsg=raw>0?`+${gained} YARDS`:raw<0?`${raw} YARDS`:'NO GAIN';
    resultSub=`${ds(down)} & ${ytg}`;
    if(down>4){ cpuTurn(); return; }
  }
}

function cpuTurn(){
  consecutiveRuns=0;
  cpuDriveLines=buildCpuDrive();
  cpuDriveIdx=0;
  showNextCpuLine();
}

function buildCpuDrive(){
  // Simulate outcome only — one result card
  const roll=Math.random();
  const lines=[];

  if(roll<0.32){
    score.cpu+=7;
    lines.push({ txt:'CPU TOUCHDOWN!', sub:'CPU scores  +7' });
  } else if(roll<0.52){
    score.cpu+=3;
    lines.push({ txt:'CPU FIELD GOAL', sub:'CPU scores  +3' });
  } else if(roll<0.72){
    lines.push({ txt:'CPU TURNOVER', sub:'Fumble — your ball back' });
  } else {
    lines.push({ txt:'CPU PUNTS', sub:'Three and out — your ball' });
  }

  yl=20;
  return lines;
}

function showNextCpuLine(){
  if(cpuDriveIdx>=cpuDriveLines.length){
    // Drive over — give player the ball
    state=S.RES; stTimer=2.0;
    down=1; ytg=10;
    resultMsg='YOUR BALL'; resultSub=`1ST & 10 — OWN ${yl}`;
    return;
  }
  const line=cpuDriveLines[cpuDriveIdx++];
  resultMsg=line.txt; resultSub=line.sub;
  state=S.CPU; stTimer=3.0;
}

function advQ(){
  quarter++;
  if(quarter>4){ state=S.OVER; return; }
  clock=180;
}

function syncCam(){
  const tx=ballCarrier?ballCarrier.x:ball.x;
  camX+=(tx-camX)*.055;
}

// ════════════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════════════
function render(){
  ctx.clearRect(0,0,CW,CH);
  if(state===S.TITLE){ drawTitle(); return; }
  if(state===S.OVER) { drawOver();  return; }
  drawField();
  drawPlayers();
  if(ball.air) drawBallAir();
  drawScoreboard();
  drawControlKey();          // ← small corner legend, always visible
  if(state===S.SEL)   drawPlayMenu();
  if(state===S.READY) drawReadyBanner();
  if(state===S.SNAP)  drawSnapFlash();
  if(state===S.RES||state===S.CPU) drawResult();
  if(state===S.TD)    drawTD();
  if(state===S.INTERCEPT) drawInterceptBanner();
  if(T.active&&(state===S.RUN||state===S.PASS||state===S.INTERCEPT)) drawJoystick();
}

function wX(wx){ return wx-camX+CW/2; }

// ── Field ─────────────────────────────────────────────────────
function drawField(){
  ctx.fillStyle='#08090c'; fillR(0,0,CW,FTOP);
  for(let i=0;i<10;i++){
    ctx.fillStyle=i%2===0?FG:FA2;
    fillR(wX((EZ+i*10)*PPY),FTOP,wX((EZ+(i+1)*10)*PPY)-wX((EZ+i*10)*PPY),FH);
  }
  // End zones
  ctx.fillStyle=NY_BLUE; fillR(wX(0),FTOP,wX(EZ*PPY)-wX(0),FH);
  ctx.fillStyle='#3a0000'; fillR(wX((EZ+100)*PPY),FTOP,wX((EZ+110)*PPY)-wX((EZ+100)*PPY),FH);
  // EZ labels
  ctx.save(); ctx.font='bold 19px "DM Sans",sans-serif'; ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillText('NEW YORK',(wX(0)+wX(EZ*PPY))/2,FMID+7);
  ctx.fillText('CPU',(wX((EZ+100)*PPY)+wX((EZ+110)*PPY))/2,FMID+7);
  ctx.restore();
  // Yard lines
  for(let y=0;y<=100;y+=10){
    const x=wX((EZ+y)*PPY); if(x<-5||x>CW+5) continue;
    ctx.strokeStyle=y%50===0?'rgba(255,255,255,.45)':'rgba(255,255,255,.22)';
    ctx.lineWidth=y%50===0?2:1; ln(x,FTOP,x,FBOT);
    if(y>0&&y<100){
      ctx.fillStyle='rgba(255,255,255,.4)'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
      ctx.fillText(y<=50?y:100-y,x,FTOP+13); ctx.fillText(y<=50?y:100-y,x,FBOT-3);
    }
  }
  // Line of scrimmage (yellow dashed)
  const lx=wX((EZ+yl)*PPY);
  ctx.strokeStyle='rgba(255,225,0,.8)'; ctx.lineWidth=2;
  ctx.setLineDash([7,5]); ln(lx,FTOP,lx,FBOT); ctx.setLineDash([]);
  // First down marker (orange)
  const fdx=wX((EZ+Math.min(100,yl+ytg))*PPY);
  ctx.strokeStyle='rgba(255,140,0,.8)'; ctx.lineWidth=2; ln(fdx,FTOP,fdx,FBOT);
}

// ── Players ───────────────────────────────────────────────────
function drawPlayers(){
  // Route lines for pass plays
  if([S.PASS,S.READY,S.SNAP].includes(state)){
    passRcvrs.forEach((r,i)=>{
      ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.2; ctx.setLineDash([4,5]);
      ln(wX(r.x),r.y,wX(r.rtx),r.rty); ctx.setLineDash([]);
    });
  }
  offense.forEach(p=>{
    const x=wX(p.x); if(x<-30||x>CW+30) return;
    const active=p.ctrl&&(state===S.RUN||state===S.PASS);
    drawSprite(x,p.y,NY_BLUE,NY_RED,p.num,active,p.tackled);
    // Floating receiver number badge for pass plays
    if(state===S.PASS||state===S.READY){
      const ri=passRcvrs.indexOf(p);
      if(ri>=0) drawReceiverBadge(x,p.y,['J','K','L'][ri]);
    }
  });
  defense.forEach(p=>{
    const x=wX(p.x); if(x<-30||x>CW+30) return;
    drawSprite(x,p.y,CPU_F,CPU_A,p.num,false,p.tackled);
  });
}

function drawSprite(x,y,body,helm,num,hi,dead){
  ctx.save();
  if(dead) ctx.globalAlpha=.3;
  ctx.fillStyle='rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(x+2,y+13,10,4,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=body; ctx.beginPath(); ctx.ellipse(x,y,11,13,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=hi?'#fff':helm; ctx.lineWidth=hi?2.5:1.5; ctx.stroke();
  ctx.fillStyle=helm; ctx.beginPath(); ctx.arc(x,y-8,7,Math.PI,0); ctx.fill();
  ctx.strokeStyle=hi?'#fff':'rgba(0,0,0,.3)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='bold 7px sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(num,x,y+3);
  if(hi){ ctx.fillStyle='#ffd700'; ctx.beginPath(); ctx.arc(x,y-24,4,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}

// Big floating number badge above receiver — this IS the throw instruction
function drawReceiverBadge(x,y,n){
  const pulse=(Math.sin(Date.now()/260)+1)/2;
  const by=y-42;
  const bw=26, bh=22;
  ctx.fillStyle=`rgba(255,210,60,${.85+pulse*.12})`;
  rr(x-bw/2,by,bw,bh,5); ctx.fill();
  ctx.fillStyle='#000'; ctx.font='bold 11px "Press Start 2P",monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(n,x,by+bh/2+1);
  // Arrow pointing down to player
  ctx.fillStyle=`rgba(255,210,60,${.7+pulse*.2})`;
  ctx.beginPath(); ctx.moveTo(x-5,by+bh); ctx.lineTo(x+5,by+bh); ctx.lineTo(x,by+bh+7); ctx.closePath(); ctx.fill();
  ctx.textBaseline='alphabetic';
}

function drawBallAir(){
  const x=wX(ball.x);
  ctx.save(); ctx.translate(x,ball.y); ctx.rotate(Math.atan2(ball.vy,ball.vx));
  ctx.fillStyle='#8B4513'; ctx.beginPath(); ctx.ellipse(0,0,9,5,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#d4a46a'; ctx.lineWidth=1.2; ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=.8;
  [-3,0,3].forEach(i=>{ ctx.beginPath(); ctx.moveTo(i,-2); ctx.lineTo(i,2); ctx.stroke(); });
  ctx.restore();
}

// Virtual joystick (touch only, appears when dragging)
function drawJoystick(){
  const dx=clamp(T.cx-T.sx,-JR,JR), dy=clamp(T.cy-T.sy,-JR,JR);
  ctx.save(); ctx.globalAlpha=.28;
  ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(T.sx,T.sy,JR,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';
  ctx.beginPath(); ctx.arc(T.sx+dx,T.sy+dy,20,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

// ── Scoreboard ────────────────────────────────────────────────

// ── Control Key — small legend, always on screen ──────────────
// Shows ONLY what matters for the current state
function drawControlKey(){
  const kx=CW-8, ky=FTOP+8;
  let lines=[];

  if(state===S.SEL){
    lines=[
      {k:'1 2 3 4', d:'pick a play'},
      {k:'or TAP',  d:'the play card'},
    ];
  } else if(state===S.READY){
    lines=[
      {k:'SPACE',   d:'snap the ball'},
      {k:'or TAP',  d:'the field'},
    ];
  } else if(state===S.RUN){
    lines=[
      {k:'W A S D', d:'run the ball'},
      {k:'→ RIGHT', d:'to score'},
      {k:'DODGE',   d:'red defenders'},
    ];
  } else if(state===S.PASS){
    lines=[
      {k:'W A S D', d:'move QB'},
      {k:'J  K  L', d:'throw to receiver'},
      {k:'(TAP)',   d:'tap receiver on mobile'},
      {k:'(TAP)',   d:'receiver on mobile'},
    ];
  } else if(state===S.INTERCEPT){
    lines=[
      {k:'W A S D', d:'chase with QB'},
      {k:'TACKLE',  d:'stop the return!'},
    ];
    lines=[
      {k:'🏈',      d:'ball in the air'},
    ];
  } else {
    return;
  }

  const lh=18, pad=8;
  const boxH=lines.length*lh+pad*2;
  // Measure widest line
  ctx.font='bold 7.5px "Press Start 2P",monospace';
  let maxW=0;
  lines.forEach(l=>{ maxW=Math.max(maxW,ctx.measureText(`${l.k}  ${l.d}`).width); });
  const boxW=maxW+pad*2;
  const bx=kx-boxW, by=ky;

  ctx.fillStyle='rgba(0,0,0,.72)'; rr(bx,by,boxW,boxH,6); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.1)'; ctx.lineWidth=1; rr(bx,by,boxW,boxH,6); ctx.stroke();

  lines.forEach((l,i)=>{
    const ty=by+pad+i*lh+lh/2;
    ctx.textBaseline='middle'; ctx.textAlign='left';
    // Key badge
    ctx.fillStyle='rgba(255,255,255,.12)';
    const kw=ctx.measureText(l.k).width+8;
    rr(bx+pad,ty-8,kw,16,3); ctx.fill();
    ctx.fillStyle='#ffd700'; ctx.font='bold 7.5px "Press Start 2P",monospace';
    ctx.fillText(l.k,bx+pad+4,ty+1);
    ctx.fillStyle='#999'; ctx.font='8px "DM Sans",sans-serif';
    ctx.fillText(l.d,bx+pad+kw+6,ty+1);
  });
  ctx.textBaseline='alphabetic';
}

// ── Play menu ─────────────────────────────────────────────────
function drawPlayMenu(){
  ctx.fillStyle='rgba(0,0,0,.84)'; fillR(0,FTOP,CW,FH);

  ctx.fillStyle='#ffd700'; ctx.font='bold 12px "Press Start 2P",monospace'; ctx.textAlign='center';
  ctx.fillText('── CALL YOUR PLAY ──',CW/2,FTOP+26);
  ctx.fillStyle='#666'; ctx.font='9px "Press Start 2P",monospace';
  ctx.fillText('YOU ATTACK RIGHT  →  SCORE IN THE FAR END ZONE',CW/2,FTOP+42);

  const rects=playCardRects();
  PLAYS.forEach((p,i)=>{
    const {x,y,w,h}=rects[i];
    ctx.fillStyle='#0e1828'; rr(x,y,w,h,8); ctx.fill();
    ctx.strokeStyle=p.col; ctx.lineWidth=2; rr(x,y,w,h,8); ctx.stroke();
    // Key badge
    ctx.fillStyle=p.col; rr(x+8,y+8,26,20,4); ctx.fill();
    ctx.fillStyle='#000'; ctx.font='bold 10px "Press Start 2P",monospace'; ctx.textAlign='center';
    ctx.fillText(i+1,x+21,y+22);
    // Name
    ctx.fillStyle='#fff'; ctx.font='bold 9px "Press Start 2P",monospace';
    ctx.fillText(p.name,x+w/2,y+36);
    // Description
    ctx.fillStyle='#888'; ctx.font='9px "DM Sans",sans-serif';
    ctx.fillText(p.sub,x+w/2,y+52);
  });
}

function playCardRects(){
  const bw=192,bh=70,gap=12,sx=CW/2-bw-gap/2,sy=FTOP+54;
  return PLAYS.map((_,i)=>({x:sx+(i%2)*(bw+gap),y:sy+Math.floor(i/2)*(bh+gap),w:bw,h:bh}));
}

}

// ── Utils ─────────────────────────────────────────────────────
function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function ds(d){ return['1ST','2ND','3RD','4TH'][clamp(d-1,0,3)]; }
function ln(x1,y1,x2,y2){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
function fillR(x,y,w,h){ ctx.fillRect(x,y,w,h); }
function rr(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
