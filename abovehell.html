// ── AUDIO ──────────────────────────────────────────────────
let audioCtx=null;
let masterGain=null;

function initAudio(){
  if(audioCtx)return;
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=0.7;
  masterGain.connect(audioCtx.destination);

  // Layer 1: deep sub hum — like a building transformer
  const sub=audioCtx.createOscillator();
  sub.type='sine'; sub.frequency.value=42;
  const subG=audioCtx.createGain(); subG.gain.value=0.08;
  sub.connect(subG); subG.connect(masterGain);
  sub.start();

  // Layer 2: mid hum — like distant HVAC
  const mid=audioCtx.createOscillator();
  mid.type='sine'; mid.frequency.value=126; // 3rd harmonic of 42
  const midG=audioCtx.createGain(); midG.gain.value=0.025;
  const midLpf=audioCtx.createBiquadFilter();
  midLpf.type='lowpass'; midLpf.frequency.value=200;
  mid.connect(midLpf); midLpf.connect(midG); midG.connect(masterGain);
  mid.start();

  // Layer 3: continuous filtered noise — like air moving through ducts
  function makeAtmosphere(){
    const sr=audioCtx.sampleRate;
    const buf=audioCtx.createBuffer(1,sr*4,sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=audioCtx.createBufferSource();
    src.buffer=buf; src.loop=true;
    const lpf=audioCtx.createBiquadFilter(); lpf.type='lowpass'; lpf.frequency.value=300;
    const aG=audioCtx.createGain(); aG.gain.value=0.018;
    src.connect(lpf); lpf.connect(aG); aG.connect(masterGain);
    src.start();
  }
  makeAtmosphere();
}

// A slow ambient tone — attack over 600ms minimum, no transient
function ambientTone(freq, vol, totalDur){
  if(!audioCtx||!masterGain)return;
  const now=audioCtx.currentTime;
  const attack=totalDur*0.45;
  const release=totalDur*0.55;
  const o=audioCtx.createOscillator();
  const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=freq*1.5;
  const g=audioCtx.createGain();
  o.type='sine'; o.frequency.value=freq;
  o.connect(lp); lp.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(vol, now+attack);
  g.gain.linearRampToValueAtTime(0, now+attack+release);
  o.start(now); o.stop(now+totalDur+0.1);
}

// Filtered noise swell — no attack, just a gentle fade in/out
function noiseSwell(freq, q, vol, totalDur){
  if(!audioCtx||!masterGain)return;
  const now=audioCtx.currentTime;
  const sr=audioCtx.sampleRate;
  const buf=audioCtx.createBuffer(1,sr*totalDur,sr);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const bp=audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=q;
  const g=audioCtx.createGain();
  src.connect(bp); bp.connect(g); g.connect(masterGain);
  g.gain.setValueAtTime(0,now);
  g.gain.linearRampToValueAtTime(vol, now+totalDur*0.4);
  g.gain.linearRampToValueAtTime(0, now+totalDur);
  src.start(now);
}

function playSound(type){
  if(!audioCtx)return;
  // All sounds: slow fade in, slow fade out, sine waves only except steam
  if(type==='hit')    ambientTone(95,  0.09, 1.2);
  if(type==='hurt')   ambientTone(60,  0.12, 1.5);
  if(type==='pickup') ambientTone(420, 0.06, 1.0);
  if(type==='steam')  noiseSwell(900,  1.2,  0.07, 2.0);
  if(type==='door')   ambientTone(75,  0.08, 1.4);
}

let map=[],MAPW=62,MAPH=26;
function buildMap(ld){
  MAPW=ld.w;MAPH=ld.h;
  const m=Array.from({length:MAPH},()=>new Uint8Array(MAPW));
  // Carve segments
  for(const[x1,y1,x2,y2,tp]of ld.segs){
    for(let y=Math.max(0,y1);y<=Math.min(MAPH-1,y2);y++)
      for(let x=Math.max(0,x1);x<=Math.min(MAPW-1,x2);x++)
        m[y][x]=tp;
  }
  // Special tiles
  if(ld.entry)m[ld.entry.y][ld.entry.x]=T.ENTRY;
  if(ld.exit)m[ld.exit.y][ld.exit.x]=T.EXIT;
  if(ld.door&&m[ld.door.y]&&m[ld.door.y][ld.door.x]!==T.VOID)m[ld.door.y][ld.door.x]=T.DOOR;
  for(const f of ld.fluors||[]){if(m[f.y]&&m[f.y][f.x]!==T.VOID)m[f.y][f.x]=T.FLUOR;}
  // Walls around all non-void
  for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){
    if(m[y][x]!==T.VOID)continue;
    let near=false;
    outer:for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const ny=y+dy,nx=x+dx;
      if(ny<0||ny>=MAPH||nx<0||nx>=MAPW)continue;
      const t=m[ny][nx];
      if(t!==T.VOID&&t!==T.WALL){near=true;break outer;}
    }
    if(near)m[y][x]=T.WALL;
  }
  return m;
}

// ── PLAYER ───────────────────────────────────────────────
let player;
function initPlayer(wx,wy){
  player={
    wx,wy,angle:0,
    hp:100,maxHp:100,
    xp:0,xpNext:60,level:1,atk:14,def:3,
    bat:100,maxBat:100,    // flashlight battery
    state:'idle',
    atkTimer:0,atkCD:0.45,
    hurtTimer:0,invTimer:0,
    kx:0,ky:0,
    SPD:155,
    hasKey:false,
    journalCount:0,
    journalText:'',journalTimer:0,
    msgText:'',msgTimer:0,
  };
}

// ── WORLD STATE ──────────────────────────────────────────
let currentLevel=0,score=0,kills=0,combo=0,comboTimer=0;
let enemies=[],items=[],stains=[],graffiti=[];
let particles=[],steamClouds=[];
let ventState=[];
let camX=0,camY=0;
let visited=[];
let shake=0,shakeX=0,shakeY=0;
let lt=0,dt=0,gtime=0;
let state=S.TITLE;

// ── CAMERA / COORD UTILS ─────────────────────────────────
function clampCam(){
  camX=Math.max(0,Math.min(MAPW*TILE-RW,player.wx-RW/2));
  camY=Math.max(0,Math.min(MAPH*TILE-RH,player.wy-RH/2));
}
function w2s(wx,wy){return{sx:((wx-camX)|0),sy:((wy-camY)|0)};}
function tAt(wx,wy){
  const tx=Math.floor(wx/TILE),ty=Math.floor(wy/TILE);
  if(tx<0||tx>=MAPW||ty<0||ty>=MAPH)return T.WALL;
  return map[ty][tx];
}
function passable(t){return t===T.FLOOR||t===T.ENTRY||t===T.EXIT||t===T.FLUOR||t===T.FLOOD||t===T.HOT||t===T.VENT;}
function canPass(wx,wy){
  const R=9;
  return passable(tAt(wx-R,wy-R))&&passable(tAt(wx+R,wy-R))&&
         passable(tAt(wx-R,wy+R))&&passable(tAt(wx+R,wy+R));
}

// ── MOVEMENT ─────────────────────────────────────────────
function handleMovement(){
  if(player.state==='dead')return;
  // Aim toward mouse
  const{sx,sy}=w2s(player.wx,player.wy);
  player.angle=Math.atan2(mouseY-sy,mouseX-sx);

  let dx=0,dy=0;
  if(keys['KeyW']||keys['ArrowUp'])    dy=-1;
  if(keys['KeyS']||keys['ArrowDown'])  dy+=1;
  if(keys['KeyA']||keys['ArrowLeft'])  dx=-1;
  if(keys['KeyD']||keys['ArrowRight']) dx+=1;

  const curTile=tAt(player.wx,player.wy);
  const spd=(curTile===T.FLOOD?0.38:1.0)*player.SPD*dt;

  if(dx||dy){
    const L=Math.hypot(dx,dy);dx/=L;dy/=L;
    player.state=player.atkTimer>0?'attack':'move';
    if(canPass(player.wx+dx*spd,player.wy))player.wx+=dx*spd;
    if(canPass(player.wx,player.wy+dy*spd))player.wy+=dy*spd;
  } else {if(player.state==='move')player.state='idle';}

  // Knockback
  if(Math.abs(player.kx)+Math.abs(player.ky)>0.5){
    if(canPass(player.wx+player.kx*dt*3,player.wy))player.wx+=player.kx*dt*3;
    if(canPass(player.wx,player.wy+player.ky*dt*3))player.wy+=player.ky*dt*3;
    player.kx*=0.75;player.ky*=0.75;
  }

  if(player.atkTimer>0)player.atkTimer-=dt;
  if(player.invTimer>0)player.invTimer-=dt;
  if(player.hurtTimer>0)player.hurtTimer-=dt;

  // Flashlight battery drain
  player.bat=Math.max(0,player.bat-dt*0.8);

  // Hot tile damage
  if(curTile===T.HOT&&player.invTimer<=0){
    player.hp-=2.2*dt;
    if(player.hp<=0){player.hp=0;state=S.DEAD;}
    if(Math.random()<0.03)spawnParticles(player.wx,player.wy,'#ff6600',1);
  }

  // Mark visited tiles for minimap
  const tx=Math.floor(player.wx/TILE),ty=Math.floor(player.wy/TILE);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const nx=tx+dx,ny=ty+dy;
    if(nx>=0&&nx<MAPW&&ny>=0&&ny<MAPH)visited[ny][nx]=true;
  }

  // Update vent states
  for(const v of ventState){
    v.t+=dt;
    if(v.t>v.period){v.t=0;v.period=7+Math.random()*6;v.firing=false;v.warning=false;}
    else if(v.t>v.period-1){if(!v.firing){v.firing=true;playSound('steam');}
      // Vent damage
      const d=Math.hypot(player.wx-v.wx,player.wy-v.wy);
      if(d<TILE*1.5&&player.invTimer<=0){player.hp-=25*dt;player.invTimer=0.1;shake=Math.max(shake,6);if(player.hp<=0){player.hp=0;state=S.DEAD;}}
    } else if(v.t>v.period-1.8){v.warning=true;}
    if(v.firing)spawnSteam(v.wx,v.wy);
  }
}

// ── COMBAT ───────────────────────────────────────────────
function tryAttack(){
  if(player.atkTimer>0)return;
  player.atkTimer=player.atkCD;
  player.state='attack';
  const RANGE=TILE*2.2,HARC=Math.PI*0.65;
  let hit=false;
  for(const e of enemies){
    if(e.dead)continue;
    const ex=e.wx-player.wx,ey=e.wy-player.wy,dist=Math.hypot(ex,ey);
    if(dist>RANGE)continue;
    let da=Math.atan2(ey,ex)-player.angle;
    while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
    if(Math.abs(da)>HARC)continue;
    const dmg=player.atk+Math.floor(Math.random()*8)-(e.type==='WRAITH'?5:0);
    e.hp-=dmg;e.hurtTimer=0.2;
    const kf=70/Math.max(dist,0.1);e.kx=ex*kf;e.ky=ey*kf;
    spawnParticles(e.wx,e.wy,'#c84020',4);
    playSound('hit');hit=true;
    if(e.hp<=0){e.dead=true;kills++;score+=e.xp;combo++;comboTimer=2.0;
      gainXP(e.xp);spawnParticles(e.wx,e.wy,e.col,8);}
  }
  if(hit)shake=Math.max(shake,5);
}

function gainXP(amt){
  player.xp+=amt;
  while(player.xp>=player.xpNext){
    player.xp-=player.xpNext;player.xpNext=Math.floor(player.xpNext*1.6);
    player.level++;player.maxHp+=18;player.hp=Math.min(player.hp+45,player.maxHp);
    player.atk+=3;player.def+=2;player.maxBat+=15;
    state=S.LEVELUP;
  }
}

// ── ENEMY AI ─────────────────────────────────────────────
const ETYPES={
  RAT:  {hp:12,dmg:10,spd:72, sight:4,xp:8, col:'#887060',sz:7},
  GUARD:{hp:40,dmg:18,spd:58, sight:9,xp:25,col:'#406080',sz:12},
  WRAITH:{hp:28,dmg:22,spd:80,sight:10,xp:38,col:'#8090d0',sz:11},
};

function updateEnemies(){
  for(const e of enemies){
    if(e.dead)continue;
    if(e.hurtTimer>0)e.hurtTimer-=dt;
    if(e.atkTimer>0)e.atkTimer-=dt;
    // Knockback
    if(Math.abs(e.kx)+Math.abs(e.ky)>0.5){
      if(canPass(e.wx+e.kx*dt*3,e.wy))e.wx+=e.kx*dt*3;
      if(canPass(e.wx,e.wy+e.ky*dt*3))e.wy+=e.ky*dt*3;
      e.kx*=0.78;e.ky*=0.78;
    }
    const dx=player.wx-e.wx,dy=player.wy-e.wy,dist=Math.hypot(dx,dy);
    if(dist<e.sight*TILE){
      e.state='chase';
      e.angle=Math.atan2(dy,dx);
      if(dist<TILE*1.1){
        e.state='attack';
        if(e.atkTimer<=0&&player.invTimer<=0){
          e.atkTimer=e.atkCD;
          const dmg=Math.max(1,e.dmg-player.def+Math.floor(Math.random()*6));
          player.hp-=dmg;player.invTimer=0.5;player.hurtTimer=0.25;
          const kf=80/Math.max(dist,0.1);player.kx=-dx*kf;player.ky=-dy*kf;
          shake=Math.max(shake,9);playSound('hurt');
          if(player.hp<=0){player.hp=0;state=S.DEAD;}
        }
      } else {
        const spd=e.spd*dt/Math.max(dist,0.1);
        const nx=e.wx+dx*spd,ny=e.wy+dy*spd;
        if(canPass(nx,e.wy))e.wx=nx;
        if(canPass(e.wx,ny))e.wy=ny;
      }
    } else {
      e.state='idle';
      e.wTimer=(e.wTimer||0)-dt;
      if(e.wTimer<=0){e.wTimer=1+Math.random()*2;e.wAngle=(e.wAngle||0)+(-1+Math.random()*2)*1.4;}
      if(e.type==='GUARD'){
        // Guard patrol between ax/bx or ay/by
        if(e.ax!==undefined){
          const px=e.patDir||1;
          const ns=e.wx+px*e.spd*0.5*dt;
          if(ns<e.ax*TILE+TILE/2)e.patDir=1;
          else if(ns>e.bx*TILE+TILE/2)e.patDir=-1;
          else {if(canPass(ns,e.wy))e.wx=ns;}
          e.angle=e.patDir>0?0:Math.PI;
        } else if(e.ay!==undefined){
          const py=e.patDir||1;
          const ns=e.wy+py*e.spd*0.5*dt;
          if(ns<e.ay*TILE+TILE/2)e.patDir=1;
          else if(ns>e.by*TILE+TILE/2)e.patDir=-1;
          else {if(canPass(e.wx,ns))e.wy=ns;}
          e.angle=e.patDir>0?Math.PI/2:Math.PI*1.5;
        }
      } else {
        const wspd=e.spd*0.18*dt;
        const nx=e.wx+Math.cos(e.wAngle)*wspd,ny=e.wy+Math.sin(e.wAngle)*wspd;
        if(canPass(nx,e.wy))e.wx=nx;if(canPass(e.wx,ny))e.wy=ny;
      }
    }
  }
}

// ── PARTICLES / STEAM ────────────────────────────────────
function spawnParticles(wx,wy,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=50+Math.random()*100;
    particles.push({wx,wy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*3,col,life:0.3+Math.random()*0.3});
  }
}
function spawnSteam(wx,wy){
  if(Math.random()<0.7)return;
  steamClouds.push({wx:wx+(Math.random()-0.5)*12,wy:wy+(Math.random()-0.5)*12,r:4,maxR:18+Math.random()*14,vx:(Math.random()-0.5)*12,vy:-20-Math.random()*20,life:0.8+Math.random()*0.5,alpha:0.5});
}
function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.wx+=p.vx*dt;p.wy+=p.vy*dt;p.vx*=0.85;p.vy*=0.85;p.life-=dt;if(p.life<=0)particles.splice(i,1);
  }
  for(let i=steamClouds.length-1;i>=0;i--){
    const s=steamClouds[i];s.wx+=s.vx*dt;s.wy+=s.vy*dt;s.r=Math.min(s.maxR,s.r+30*dt);s.life-=dt;if(s.life<=0)steamClouds.splice(i,1);
  }
}

// ── PICKUPS / EXIT ────────────────────────────────────────
function tryPickups(){
  for(const it of items){
    if(!it.alive)continue;
    if(Math.hypot(it.wx-player.wx,it.wy-player.wy)<26){
      it.alive=false;playSound('pickup');
      if(it.type==='MEDKIT'){player.hp=Math.min(player.maxHp,player.hp+45);showMsg('+45 HP');}
      if(it.type==='BATTERY'){player.bat=Math.min(player.maxBat,player.bat+60);showMsg('BATTERY +60');}
      if(it.type==='JOURNAL'){
        player.journalCount++;score+=80;
        player.journalText=LEVELS[currentLevel].journal;
        player.journalTimer=6.5;
        showMsg('JOURNAL ENTRY FOUND');
      }
      spawnParticles(player.wx,player.wy,it.type==='MEDKIT'?'#ff4040':it.type==='BATTERY'?'#ffd700':'#40c040',4);
    }
  }
  // Key
  const ld=LEVELS[currentLevel];
  if(!player.hasKey&&ld.keyAt){
    const kx=ld.keyAt.x*TILE+TILE/2,ky=ld.keyAt.y*TILE+TILE/2;
    if(Math.hypot(kx-player.wx,ky-player.wy)<28){
      player.hasKey=true;playSound('door');showMsg('KEY CARD FOUND');
      spawnParticles(player.wx,player.wy,'#ffd700',8);
      if(ld.door){map[ld.door.y][ld.door.x]=T.FLOOR;}
    }
  }
  // Exit — check within 1.5 tile radius so it's easy to trigger
  const ld2=LEVELS[currentLevel];
  const ex=ld2.exit.x*TILE+TILE/2, ey=ld2.exit.y*TILE+TILE/2;
  if(Math.hypot(player.wx-ex,player.wy-ey)<TILE*1.5){
    if(currentLevel>=LEVELS.length-1){state=S.WIN;}
    else{currentLevel++;loadLevel();}
  }
}

function showMsg(t){player.msgText=t;player.msgTimer=2.5;}
function nextLevel(){state=S.PLAY;}

// ── LOAD LEVEL ────────────────────────────────────────────
function loadLevel(){
  const ld=LEVELS[currentLevel];
  map=buildMap(ld);
  visited=Array.from({length:MAPH},()=>new Uint8Array(MAPW));
  enemies=[];items=[];stains=[];graffiti=[];ventState=[];steamClouds=[];particles=[];
  // Enemies
  for(const ed of ld.enemyDefs||[]){
    const b=ETYPES[ed.type];const sc=1+currentLevel*0.15;
    enemies.push({
      wx:ed.tx*TILE+TILE/2,wy:ed.ty*TILE+TILE/2,
      type:ed.type,col:b.col,sz:b.sz,
      hp:Math.ceil(b.hp*(ed.hard?1.8:sc)),maxHp:Math.ceil(b.hp*(ed.hard?1.8:sc)),
      dmg:Math.ceil(b.dmg+currentLevel*1.8),spd:b.spd,
      sight:b.sight,xp:b.xp+currentLevel*5,
      ax:ed.ax,bx:ed.bx,ay:ed.ay,by:ed.by,
      state:'idle',atkTimer:0,atkCD:1.4,hurtTimer:0,angle:0,dead:false,kx:0,ky:0,
      wAngle:Math.random()*Math.PI*2,wTimer:1,patDir:1,
    });
  }
  // Items
  for(const id of ld.itemDefs||[]){
    items.push({tx:id.tx,ty:id.ty,wx:id.tx*TILE+TILE/2,wy:id.ty*TILE+TILE/2,type:id.type,alive:true,ph:Math.random()*Math.PI*2});
  }
  // Key item
  if(ld.keyAt)items.push({tx:ld.keyAt.x,ty:ld.keyAt.y,wx:ld.keyAt.x*TILE+TILE/2,wy:ld.keyAt.y*TILE+TILE/2,type:'KEY',alive:true,ph:0});
  // Stains
  for(const s of ld.stains||[])stains.push(s);
  // Graffiti
  for(const g of ld.graffiti||[])graffiti.push(g);
  // Vent state
  for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){
    if(map[y][x]===T.VENT)ventState.push({wx:x*TILE+TILE/2,wy:y*TILE+TILE/2,t:Math.random()*8,period:7+Math.random()*6,firing:false,warning:false});
  }
  initPlayer(ld.entry.x*TILE+TILE/2,ld.entry.y*TILE+TILE/2);
  clampCam();
}

function startGame(){
  initAudio();currentLevel=0;score=0;kills=0;combo=0;comboTimer=0;
  loadLevel();state=S.PLAY;
}

// ── TILE TEXTURE CACHE ────────────────────────────────────
const TCACHE={};
function getTile(type,v){
  const key=`${type}_${v%8}`;if(TCACHE[key])return TCACHE[key];
  const tc=document.createElement('canvas');tc.width=tc.height=TILE;const tx=tc.getContext('2d');
  // Deterministic noise from variant
  const N=(i)=>(Math.sin(v*i*9.1+type*3.7)*0.5+0.5);
  if(type===T.FLOOR||type===T.ENTRY||type===T.EXIT){
    const br=0.14+N(1)*0.08;
    tx.fillStyle=`rgb(${(36+br*30)|0},${(36+br*30)|0},${(40+br*30)|0})`;
    tx.fillRect(0,0,TILE,TILE);
    // Grit
    for(let i=0;i<4;i++){const gx=N(i*3)*TILE,gy=N(i*3+1)*TILE;tx.fillStyle=`rgba(0,0,0,${0.04+N(i*3+2)*0.08})`;tx.fillRect(gx,gy,2,2);}
    // Puddle
    if(N(7)<0.28){tx.fillStyle='rgba(60,80,100,0.12)';tx.beginPath();tx.ellipse(N(8)*TILE*0.6+TILE*0.2,N(9)*TILE*0.6+TILE*0.2,(N(10)*6+3),(N(11)*3+1),N(12)*Math.PI,0,Math.PI*2);tx.fill();}
    if(type===T.EXIT){tx.fillStyle='rgba(0,100,80,0.22)';tx.fillRect(0,0,TILE,TILE);}
    if(type===T.ENTRY){tx.fillStyle='rgba(0,50,150,0.18)';tx.fillRect(0,0,TILE,TILE);}
  } else if(type===T.WALL){
    const br=0.22+N(1)*0.1;
    tx.fillStyle=`rgb(${(52*br)|0},${(50*br)|0},${(46*br)|0})`;
    tx.fillRect(0,0,TILE,TILE);
    const my=(TILE*0.42+N(2)*TILE*0.2)|0;
    tx.fillStyle='rgba(0,0,0,0.32)';tx.fillRect(0,my,TILE,2);
    const ox=(v%2)*(TILE>>1);
    tx.fillStyle='rgba(0,0,0,0.22)';tx.fillRect(ox%TILE,0,1.5,my);tx.fillRect((ox+TILE/2)%TILE,my,1.5,TILE-my);
    // Rust stain
    if(N(3)<0.4){const rx=(N(4)*TILE)|0,ry=(N(5)*TILE*0.4)|0;const rg=tx.createLinearGradient(rx,ry,rx+2,ry+TILE);rg.addColorStop(0,'rgba(100,40,10,0.35)');rg.addColorStop(1,'rgba(100,40,10,0)');tx.fillStyle=rg;tx.fillRect(rx-1,ry,4,TILE-ry);}
    // Pipe shadow
    tx.fillStyle='rgba(0,0,0,0.12)';tx.fillRect(0,TILE-4,TILE,4);
  } else if(type===T.FLOOD){
    tx.fillStyle=`rgb(${(18+N(1)*12)|0},${(24+N(2)*12)|0},${(36+N(3)*14)|0})`;
    tx.fillRect(0,0,TILE,TILE);
    tx.strokeStyle='rgba(60,100,140,0.3)';tx.lineWidth=1;
    for(let i=0;i<2;i++){tx.beginPath();tx.arc(N(i*4)*TILE,N(i*4+1)*TILE,4+N(i*4+2)*6,0,Math.PI*0.7);tx.stroke();}
  } else if(type===T.HOT){
    const br=0.22+N(1)*0.1;
    tx.fillStyle=`rgb(${(62*br)|0},${(32*br)|0},${(14*br)|0})`;
    tx.fillRect(0,0,TILE,TILE);
    tx.fillStyle='rgba(255,80,0,0.07)';tx.fillRect(0,0,TILE,TILE);
  } else if(type===T.VENT){
    tx.fillStyle=`rgb(${(55)|0},${(50)|0},${(45)|0})`;tx.fillRect(0,0,TILE,TILE);
    tx.strokeStyle='rgba(180,100,40,0.8)';tx.lineWidth=2;
    tx.beginPath();tx.arc(TILE/2,TILE/2,TILE*0.38,0,Math.PI*2);tx.stroke();
    tx.fillStyle='rgba(150,80,30,0.6)';tx.beginPath();tx.arc(TILE/2,TILE/2,TILE*0.18,0,Math.PI*2);tx.fill();
  } else if(type===T.DOOR){
    tx.fillStyle='#2a2828';tx.fillRect(0,0,TILE,TILE);
    tx.strokeStyle='#c07820';tx.lineWidth=2;tx.strokeRect(2,2,TILE-4,TILE-4);
    tx.fillStyle='#c07820';tx.font='bold '+(TILE*0.35)+'px monospace';tx.textAlign='center';
    tx.fillText('🔒',TILE/2+1,TILE/2+4);
  } else if(type===T.FLUOR){
    tx.fillStyle=`rgb(${(36)|0},${(36)|0},${(40)|0})`;tx.fillRect(0,0,TILE,TILE);
    tx.fillStyle='rgba(200,230,200,0.85)';tx.fillRect(2,TILE*0.3,TILE-4,TILE*0.4);
    tx.fillStyle='rgba(255,255,240,0.6)';tx.fillRect(4,TILE*0.38,TILE-8,TILE*0.24);
  }
  TCACHE[key]=tc;return tc;
}

// ── WORLD RENDERING ──────────────────────────────────────
function drawWorld(){
  X.fillStyle='#060504';X.fillRect(0,0,RW,RH);
  const tx0=Math.max(0,(camX/TILE)|0),ty0=Math.max(0,(camY/TILE)|0);
  const tx1=Math.min(MAPW,Math.ceil((camX+RW)/TILE)+1);
  const ty1=Math.min(MAPH,Math.ceil((camY+RH)/TILE)+1);

  for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++){
    const t=map[ty][tx];if(t===T.VOID)continue;
    const sx=(tx*TILE-camX)|0,sy=(ty*TILE-camY)|0;
    X.drawImage(getTile(t,(tx*3+ty*7)%8),sx,sy);

    // Pipe conduit along wall edges
    if(t===T.FLOOR||t===T.HOT){
      // Check adjacent walls and draw pipes on floor side
      if(ty>0&&(map[ty-1][tx]===T.WALL||map[ty-1][tx]===T.VOID)){
        X.fillStyle='#6a4020';X.fillRect(sx,sy,TILE,3);
        X.fillStyle='rgba(180,100,40,0.5)';X.fillRect(sx+2,sy+1,TILE-4,1);
      }
      if(ty<MAPH-1&&(map[ty+1][tx]===T.WALL||map[ty+1][tx]===T.VOID)){
        X.fillStyle='#6a4020';X.fillRect(sx,sy+TILE-3,TILE,3);
        X.fillStyle='rgba(180,100,40,0.5)';X.fillRect(sx+2,sy+TILE-2,TILE-4,1);
      }
      if(tx>0&&(map[ty][tx-1]===T.WALL||map[ty][tx-1]===T.VOID)){
        X.fillStyle='#6a4020';X.fillRect(sx,sy,3,TILE);
        X.fillStyle='rgba(180,100,40,0.5)';X.fillRect(sx+1,sy+2,1,TILE-4);
      }
      if(tx<MAPW-1&&(map[ty][tx+1]===T.WALL||map[ty][tx+1]===T.VOID)){
        X.fillStyle='#6a4020';X.fillRect(sx+TILE-3,sy,3,TILE);
        X.fillStyle='rgba(180,100,40,0.5)';X.fillRect(sx+TILE-2,sy+2,1,TILE-4);
      }
    }
    // Exit glow
    if(t===T.EXIT){X.fillStyle='rgba(0,180,120,0.18)';X.fillRect(sx,sy,TILE,TILE);X.fillStyle='#00e080';X.font='bold 13px monospace';X.textAlign='center';X.fillText('↓',sx+TILE/2,sy+TILE/2+5);}
    if(t===T.ENTRY){X.fillStyle='#224488';X.font='bold 13px monospace';X.textAlign='center';X.fillText('↑',sx+TILE/2,sy+TILE/2+5);}
    // Vent glow warning
    const vs=ventState.find(v=>Math.abs(v.wx-(tx*TILE+TILE/2))<2&&Math.abs(v.wy-(ty*TILE+TILE/2))<2);
    if(vs&&vs.warning){const a=Math.sin(gtime*8)*0.4+0.6;X.fillStyle=`rgba(255,160,0,${a*0.35})`;X.fillRect(sx-TILE,sy-TILE,TILE*3,TILE*3);}
    if(vs&&vs.firing){X.fillStyle='rgba(255,220,200,0.12)';X.fillRect(sx-TILE*2,sy-TILE*2,TILE*5,TILE*5);}
  }

  // Blood stains
  for(const s of stains){
    const{sx,sy}=w2s(s.tx*TILE+TILE/2,s.ty*TILE+TILE/2);
    if(sx<-20||sx>RW+20||sy<-20||sy>RH+20)continue;
    X.globalAlpha=0.42;X.fillStyle='#6a1008';X.beginPath();X.ellipse(sx,sy,9,6,s.tx*0.7,0,Math.PI*2);X.fill();X.globalAlpha=1;
  }

  // Graffiti
  for(const g of graffiti){
    const{sx,sy}=w2s(g.tx*TILE+TILE/2,g.ty*TILE);
    if(sx<-80||sx>RW+80||sy<-20||sy>RH+20)continue;
    X.globalAlpha=0.55;X.fillStyle='#a8c040';X.font='bold 9px Share Tech Mono,monospace';X.textAlign='center';
    X.fillText(g.text,sx,sy-2);X.globalAlpha=1;
  }
}

// ── ITEMS RENDERING ───────────────────────────────────────
function drawItems(){
  const ld=LEVELS[currentLevel];
  for(const it of items){
    if(!it.alive)continue;
    const{sx,sy}=w2s(it.wx,it.wy);

      X.globalAlpha=0.3+Math.sin(gtime*4)*0.15;X.fillStyle='#ffd700';X.beginPath();X.arc(0,0,16,0,Math.PI*2);X.fill();X.globalAlpha=1;
      X.fillStyle='#ffc800';X.strokeStyle='#a07800';X.lineWidth=1.5;
      X.beginPath();X.arc(0,-3,6,0,Math.PI*2);X.stroke();
      X.beginPath();X.moveTo(0,3);X.lineTo(0,12);X.lineTo(3,12);X.lineTo(3,9);X.lineTo(5,9);X.lineTo(5,11);X.lineTo(7,11);X.stroke();
      X.fillStyle='#ffe050';X.font='10px monospace';X.textAlign='center';X.fillText('KEY',0,25);
    } else if(it.type==='MEDKIT'){
      X.fillStyle='rgba(200,0,0,0.2)';X.beginPath();X.arc(0,0,14,0,Math.PI*2);X.fill();
      X.fillStyle='#cc0000';X.fillRect(-10,-3,20,7);X.fillRect(-3,-10,7,20);

    } else if(it.type==='BATTERY'){

      X.fillStyle='#fff';X.fillRect(-5,-9,10,14);X.fillStyle='#00aa00';X.fillRect(-4,-8,8,10);
    } else if(it.type==='JOURNAL'){
      X.fillStyle='#e8d8a0';X.fillRect(-9,-12,18,22);X.fillStyle='#6a4010';X.fillRect(-8,-11,16,20);
      X.fillStyle='rgba(255,240,180,0.8)';
      for(let i=0;i<4;i++)X.fillRect(-5,-8+i*5,10,1.5);
      X.fillStyle='#2a6020';X.font='bold 8px monospace';X.textAlign='center';X.fillText('LOG',0,16);

}

// ── SIGNS RENDERING ──────────────────────────────────────
function drawSigns(){
  const ld=LEVELS[currentLevel];
  for(const sg of ld.signs||[]){
    const wx=sg.tx*TILE+TILE/2,wy=sg.ty*TILE-4;
    if(Math.hypot(wx-player.wx,wy-player.wy)>TILE*8)continue;
    const{sx,sy}=w2s(wx,wy);
    if(sx<-80||sx>RW+80||sy<-30||sy>RH+30)continue;
    const lineH=12,pad=5;const maxW=Math.max(...sg.lines.map(l=>l.length))*7+pad*2;const h=sg.lines.length*lineH+pad*2;
    X.fillStyle='rgba(15,12,8,0.88)';X.fillRect(sx-maxW/2,sy-h-4,maxW,h);
    X.strokeStyle='#7a5a10';X.lineWidth=1;X.strokeRect(sx-maxW/2,sy-h-4,maxW,h);
    X.fillStyle='#c8a040';X.font='bold 9px Share Tech Mono,monospace';X.textAlign='center';
    sg.lines.forEach((l,i)=>X.fillText(l,sx,sy-h-4+pad+(i+1)*lineH-2));
  }
}

// ── ENEMY RENDERING ──────────────────────────────────────
function drawEnemies(){
  for(const e of enemies){
    if(e.dead)continue;
    const{sx,sy}=w2s(e.wx,e.wy);
    if(sx<-40||sx>RW+40||sy<-40||sy>RH+40)continue;
    const fl=e.hurtTimer>0;
    const bob=Math.sin(gtime*3.5+e.wx*0.3)*1.5;
    X.save();X.translate(sx,sy);
    // Shadow
    X.fillStyle='rgba(0,0,0,0.35)';X.beginPath();X.ellipse(1,e.sz+4,e.sz,4,0,0,Math.PI*2);X.fill();

    if(e.type==='RAT'){
      X.fillStyle=fl?'#fff':'#7a6858';X.beginPath();X.ellipse(0,bob,e.sz+2,e.sz-1,player.angle,0,Math.PI*2);X.fill();
      X.fillStyle=fl?'#fff':'#aa9070';X.beginPath();X.ellipse(-e.sz,bob-1,e.sz*0.6,e.sz*0.4,0,0,Math.PI*2);X.fill();
      X.fillStyle=fl?'#f00':'#cc1010';X.beginPath();X.arc(-e.sz-1,bob,2,0,Math.PI*2);X.fill();
      X.strokeStyle=fl?'#fff':'#6a5040';X.lineWidth=1;
      X.beginPath();X.moveTo(e.sz,bob);X.quadraticCurveTo(e.sz+8,bob-4,e.sz+10,bob+3);X.stroke();

    } else if(e.type==='GUARD'){
      // Flashlight beam (goes in facing direction)
      if(e.state==='idle'||e.state==='chase'){
        const FLEN=TILE*5.5,FWID=Math.PI*0.18;
        X.globalAlpha=0.22;X.fillStyle='#d0d8ff';
        X.beginPath();X.moveTo(0,0);X.arc(0,0,FLEN,e.angle-FWID,e.angle+FWID);X.closePath();X.fill();X.globalAlpha=1;
      }
      // Body
      X.fillStyle=fl?'#fff':'#384858';X.beginPath();X.arc(0,bob,e.sz,0,Math.PI*2);X.fill();
      X.strokeStyle=fl?'#fff':'#182028';X.lineWidth=2;X.stroke();
      // Uniform details
      X.fillStyle=fl?'#ddd':'#5070a0';X.fillRect(-3,-e.sz+2+bob,6,5);
      // Flashlight
      X.save();X.rotate(e.angle);
      X.fillStyle=fl?'#fff':'#d0d8f0';X.fillRect(e.sz-1,-3,10,5);
      X.fillStyle=fl?'#ff0':'#fffce0';X.beginPath();X.arc(e.sz+9,0,3,0,Math.PI*2);X.fill();
      X.restore();
      // Eyes (glow red when chasing)
      if(e.state==='chase'){
        X.fillStyle='#ff2020';X.beginPath();X.arc(-3,-2+bob,2.5,0,Math.PI*2);X.fill();
        X.beginPath();X.arc(3,-2+bob,2.5,0,Math.PI*2);X.fill();
      }

    } else if(e.type==='WRAITH'){
      X.globalAlpha=0.7+Math.sin(gtime*4)*0.12;
      // Trailing wisps
      for(let i=3;i>=1;i--){
        X.globalAlpha=(0.15*i);X.fillStyle=fl?'#fff':'#7080c0';
        X.beginPath();X.arc(-Math.cos(e.angle)*i*7,-Math.sin(e.angle)*i*7-bob*0.5,e.sz*(0.4+i*0.12),0,Math.PI*2);X.fill();
      }
      X.globalAlpha=0.8+Math.sin(gtime*4)*0.1;
      X.fillStyle=fl?'#fff':'#8090d0';X.beginPath();X.arc(0,-2+bob,e.sz,0,Math.PI*2);X.fill();
      X.globalAlpha=0.5;X.fillStyle=fl?'#ddf':'#5060a0';X.beginPath();X.arc(0,-2+bob,e.sz+4,0,Math.PI*2);X.fill();
      X.globalAlpha=1;
      X.fillStyle=fl?'#ff0':'#d0e0ff';X.beginPath();X.arc(-3.5,-4+bob,2.5,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(3.5,-4+bob,2.5,0,Math.PI*2);X.fill();
    }

    // HP bar
    if(e.state==='chase'||e.hurtTimer>0){
      const bw=24,bh=3;X.globalAlpha=0.9;
      X.fillStyle='#1a0000';X.fillRect(-bw/2,-e.sz-11,bw,bh);
      X.fillStyle=e.hp/e.maxHp>0.5?'#c01818':'#e06000';
      X.fillRect(-bw/2,-e.sz-11,bw*(e.hp/e.maxHp),bh);
      X.strokeStyle='#400';X.lineWidth=0.5;X.strokeRect(-bw/2,-e.sz-11,bw,bh);X.globalAlpha=1;
    }
    X.restore();
  }
}

// ── PLAYER RENDERING ─────────────────────────────────────
function drawPlayer(){
  const{sx,sy}=w2s(player.wx,player.wy);
  const fl=player.hurtTimer>0;
  X.save();X.translate(sx,sy);

  // Attack sweep arc
  if(player.state==='attack'&&player.atkTimer>0){
    const p=1-(player.atkTimer/player.atkCD);
    X.globalAlpha=0.2*(1-p);X.fillStyle='#c0e0ff';
    X.beginPath();X.moveTo(0,0);
    X.arc(0,0,TILE*2.0,player.angle-Math.PI*0.6,player.angle-Math.PI*0.6+Math.PI*1.2*Math.min(p*1.5,1));
    X.closePath();X.fill();X.globalAlpha=1;
  }

  X.rotate(player.angle+Math.PI/2);
  // Shadow
  X.fillStyle='rgba(0,0,0,0.3)';X.beginPath();X.ellipse(2,5,11,5,0,0,Math.PI*2);X.fill();
  // Body
  X.fillStyle=fl?'#ffffff':'#3858a0';X.beginPath();X.arc(0,0,12,0,Math.PI*2);X.fill();
  X.strokeStyle=fl?'#ff8080':'#182040';X.lineWidth=2;X.stroke();
  // Jacket
  X.fillStyle=fl?'#fff':'#2840c0';X.fillRect(-4,-6,8,7);
  X.fillStyle=fl?'#fff':'#5070e0';X.fillRect(-2,-5,4,3);
  // Headlamp direction indicator
  X.fillStyle=fl?'#ff0':'#c0e8ff';X.beginPath();X.arc(0,-14,3.5,0,Math.PI*2);X.fill();
  // Pipe wrench
  X.save();
  const sOff=player.state==='attack'?(1-(player.atkTimer/player.atkCD))*Math.PI*0.8-Math.PI*0.4:0;
  X.rotate(-Math.PI*0.35+sOff);
  X.fillStyle=fl?'#fff':'#8090a0';X.fillRect(-2.5,-22,5,16);
  X.fillStyle=fl?'#fff':'#607080';X.fillRect(-5,-22,10,4);X.fillRect(-5,-19,10,4);
  X.fillStyle=fl?'#ddd':'#a0b0c0';X.fillRect(-2,-6,4,8);
  X.restore();
  X.restore();
}

// ── PARTICLES RENDERING ───────────────────────────────────
function drawParticles(){
  for(const p of particles){
    const{sx,sy}=w2s(p.wx,p.wy);
    X.globalAlpha=Math.min(1,p.life*3);X.fillStyle=p.col;
    X.beginPath();X.arc(sx,sy,p.r,0,Math.PI*2);X.fill();
  }
  for(const s of steamClouds){
    const{sx,sy}=w2s(s.wx,s.wy);
    const a=Math.min(0.55,s.life*0.8)*s.alpha;
    X.globalAlpha=a;X.fillStyle='rgba(200,210,220,1)';
    X.beginPath();X.arc(sx,sy,s.r,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;
}

// ── LIGHTING ─────────────────────────────────────────────
function drawLighting(){
  const{sx:px,sy:py}=w2s(player.wx,player.wy);
  SX.clearRect(0,0,RW,RH);
  SX.fillStyle='rgba(0,0,0,0.97)';SX.fillRect(0,0,RW,RH);
  SX.globalCompositeOperation='destination-out';

  // Player flashlight (directional cone)
  const hasBat=player.bat>5;
  if(hasBat){
    const CONE=Math.PI*0.3;const RANGE=230+player.bat*0.6;
    SX.beginPath();SX.moveTo(px,py);SX.arc(px,py,RANGE,player.angle-CONE,player.angle+CONE);SX.closePath();
    const rg=SX.createRadialGradient(px,py,0,px,py,RANGE);
    rg.addColorStop(0,'rgba(0,0,0,1)');rg.addColorStop(0.55,'rgba(0,0,0,0.85)');
    rg.addColorStop(0.85,'rgba(0,0,0,0.25)');rg.addColorStop(1,'rgba(0,0,0,0)');
    SX.fillStyle=rg;SX.fill();
    // Small ambient at player
    const ag=SX.createRadialGradient(px,py,0,px,py,38);
    ag.addColorStop(0,'rgba(0,0,0,0.5)');ag.addColorStop(1,'rgba(0,0,0,0)');
    SX.fillStyle=ag;SX.beginPath();SX.arc(px,py,38,0,Math.PI*2);SX.fill();
  } else {
    // No battery: tiny glow around player
    const ag=SX.createRadialGradient(px,py,0,px,py,24);
    ag.addColorStop(0,'rgba(0,0,0,0.3)');ag.addColorStop(1,'rgba(0,0,0,0)');
    SX.fillStyle=ag;SX.beginPath();SX.arc(px,py,24,0,Math.PI*2);SX.fill();
  }

  // Guard flashlights (visible to player = spooky)
  for(const e of enemies){
    if(e.dead)return;
    const{sx,sy}=w2s(e.wx,e.wy);
    if(e.type==='GUARD'){
      const GCONE=Math.PI*0.20,GRANGE=TILE*(e.state==='chase'?9:7);
      SX.beginPath();SX.moveTo(sx,sy);SX.arc(sx,sy,GRANGE,e.angle-GCONE,e.angle+GCONE);SX.closePath();
      const grg=SX.createRadialGradient(sx,sy,0,sx,sy,GRANGE);
      grg.addColorStop(0,'rgba(0,0,0,0.85)');grg.addColorStop(0.6,'rgba(0,0,0,0.4)');grg.addColorStop(1,'rgba(0,0,0,0)');
      SX.fillStyle=grg;SX.fill();
    }
  }

  // Fluorescent tube lights
  const tx0=Math.max(0,(camX/TILE)|0),ty0=Math.max(0,(camY/TILE)|0);
  const tx1=Math.min(MAPW,(camX+RW)/TILE+2|0),ty1=Math.min(MAPH,(camY+RH)/TILE+2|0);
  for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++){
    if(map[ty][tx]!==T.FLUOR)continue;
    const fk=Math.sin(gtime*2.5+tx*1.1)*0.04+0.96;
    const{sx,sy}=w2s(tx*TILE+TILE/2,ty*TILE+TILE/2);
    const FR=80*fk;
    const fg=SX.createRadialGradient(sx,sy,0,sx,sy,FR);
    fg.addColorStop(0,'rgba(0,0,0,0.94)');fg.addColorStop(0.5,'rgba(0,0,0,0.55)');fg.addColorStop(1,'rgba(0,0,0,0)');
    SX.fillStyle=fg;SX.beginPath();SX.arc(sx,sy,FR,0,Math.PI*2);SX.fill();
  }

  // Hot tile glow (subtle orange)
  for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++){
    if(map[ty][tx]!==T.HOT)continue;
    const{sx,sy}=w2s(tx*TILE+TILE/2,ty*TILE+TILE/2);
    const hg=SX.createRadialGradient(sx,sy,0,sx,sy,28);
    hg.addColorStop(0,'rgba(0,0,0,0.3)');hg.addColorStop(1,'rgba(0,0,0,0)');
    SX.fillStyle=hg;SX.beginPath();SX.arc(sx,sy,28,0,Math.PI*2);SX.fill();
  }

  SX.globalCompositeOperation='source-over';

  // Warm flashlight tint
  if(hasBat){
    const CONE=Math.PI*0.3;const RANGE=230+player.bat*0.6;
    SX.beginPath();SX.moveTo(px,py);SX.arc(px,py,RANGE,player.angle-CONE,player.angle+CONE);SX.closePath();
    SX.fillStyle='rgba(255,248,220,0.03)';SX.fill();
  }
  // Cold fluor tint
  for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++){
    if(map[ty][tx]!==T.FLUOR)continue;
    const{sx,sy}=w2s(tx*TILE+TILE/2,ty*TILE+TILE/2);
    const cf=SX.createRadialGradient(sx,sy,0,sx,sy,70);
    cf.addColorStop(0,'rgba(200,230,200,0.055)');cf.addColorStop(1,'rgba(0,0,0,0)');
    SX.fillStyle=cf;SX.beginPath();SX.arc(sx,sy,70,0,Math.PI*2);SX.fill();
  }
  // Vignette
  const vg=X.createRadialGradient(RW/2,RH/2,120,RW/2,RH/2,RW*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  SX.fillStyle=vg;SX.fillRect(0,0,RW,RH);

  X.drawImage(SC,0,0);

  // Red hurt flash
  if(player.hurtTimer>0){X.fillStyle=`rgba(200,0,0,${player.hurtTimer*0.22})`;X.fillRect(0,0,RW,RH);}
  // Low battery warning
  if(player.bat<20&&Math.floor(gtime*3)%2===0){
    X.fillStyle='rgba(255,200,0,0.05)';X.fillRect(0,0,RW,RH);
  }
}

// ── HUD ──────────────────────────────────────────────────
function drawHUD(){
  const ld=LEVELS[currentLevel];
  const BH=62,P=10;

  // Bottom panel
  X.fillStyle='rgba(4,3,2,0.88)';X.fillRect(0,RH-BH,RW,BH);
  X.strokeStyle='#5a3a08';X.lineWidth=1.5;X.strokeRect(0,RH-BH,RW,BH);
  X.strokeStyle='#2a1a04';X.lineWidth=1;X.beginPath();X.moveTo(0,RH-BH+1.5);X.lineTo(RW,RH-BH+1.5);X.stroke();
  // Amber accent line
  X.strokeStyle='#8a5010';X.lineWidth=1;X.beginPath();X.moveTo(0,RH-BH+2.5);X.lineTo(RW,RH-BH+2.5);X.stroke();

  const barY=RH-BH+12,BW=200;

  // HP
  X.fillStyle='#180404';X.fillRect(P,barY,BW,14);
  const hpr=Math.max(0,player.hp/player.maxHp);
  const hcol=hpr>0.5?'#c01818':hpr>0.25?'#c05000':'#ff1010';
  X.fillStyle=hcol;X.fillRect(P,barY,BW*hpr,14);
  X.fillStyle='rgba(255,255,255,0.06)';X.fillRect(P,barY,BW*hpr,6);
  X.strokeStyle='#5a0808';X.lineWidth=1;X.strokeRect(P,barY,BW,14);
  X.fillStyle='#e0a0a0';X.font='bold 10px Share Tech Mono,monospace';X.textAlign='left';
  X.fillText(`HP ${player.hp|0}/${player.maxHp}`,P+4,barY+10);

  // Battery bar
  const batY=barY+18;
  X.fillStyle='#181004';X.fillRect(P,batY,BW,11);
  const bpr=player.bat/player.maxBat;
  X.fillStyle=bpr>0.3?'#b08800':(Math.floor(gtime*4)%2?'#ff8800':'#404040');
  X.fillRect(P,batY,BW*bpr,11);
  X.fillStyle='rgba(255,255,100,0.07)';X.fillRect(P,batY,BW*bpr,4);
  X.strokeStyle='#4a3004';X.lineWidth=1;X.strokeRect(P,batY,BW,11);
  X.fillStyle='#c8a040';X.font='9px Share Tech Mono,monospace';X.textAlign='left';
  X.fillText(`🔦 ${player.bat|0}%`,P+4,batY+8);

  // Level / XP
  X.fillStyle='#b08840';X.font='bold 11px Share Tech Mono,monospace';X.textAlign='left';
  X.fillText(`LVL ${player.level}`,P,RH-8);
  const xpW=Math.min(BW,BW*(player.xp/player.xpNext));
  X.fillStyle='#100a00';X.fillRect(P+50,RH-16,BW-50,6);
  X.fillStyle='#806010';X.fillRect(P+50,RH-16,xpW,6);
  X.fillStyle='#5a3808';X.font='8px Share Tech Mono,monospace';
  X.fillText(`XP`,P+52,RH-10);

  // Center info
  X.fillStyle='#a08038';X.font='bold 13px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText(`RUN ${currentLevel+1}/${LEVELS.length}  ·  ${ld.name}`,RW/2,RH-BH+14);
  X.fillStyle='#6a5025';X.font='10px Share Tech Mono,monospace';
  X.fillText(ld.sub,RW/2,RH-BH+27);

  // Kills / score
  X.fillStyle='#6a5025';X.font='10px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText(`KILLS: ${kills}  SCORE: ${score}`,RW/2,RH-8);

  // Right: Journal + key status
  X.fillStyle='#a09030';X.font='bold 12px Share Tech Mono,monospace';X.textAlign='right';
  X.fillText(`JOURNAL: ${player.journalCount}  ${player.hasKey?'[KEY CARD ✓]':''}`,RW-P,RH-BH+14);
  X.fillStyle='#7a6020';X.font='10px Share Tech Mono,monospace';
  X.fillText(`ATK ${player.atk}  DEF ${player.def}`,RW-P,RH-BH+27);

  // Combo
  if(comboTimer>0&&combo>=2){
    X.save();X.globalAlpha=Math.min(1,comboTimer);
    X.fillStyle='#ffe840';X.font='bold 26px Share Tech Mono,monospace';X.textAlign='center';
    X.shadowColor='#ff8000';X.shadowBlur=12;
    X.fillText(`×${combo} COMBO`,RW/2,RH/2-80);
    X.restore();
  }

  // Message
  if(player.msgTimer>0){
    const a=Math.min(1,player.msgTimer*2);
    X.globalAlpha=a;X.fillStyle='#ffd040';
    X.font='bold 15px Share Tech Mono,monospace';X.textAlign='center';
    X.fillText(player.msgText,RW/2,RH-BH-18);
    X.globalAlpha=1;
  }

  // Journal text (side panel)
  if(player.journalTimer>0){
    const a=Math.min(1,player.journalTimer);
    X.globalAlpha=a*0.97;
    const JW=280,JX=RW-JW-10,JY=10;
    X.fillStyle='rgba(8,6,2,0.95)';X.fillRect(JX,JY,JW,170);
    X.strokeStyle='#8a5810';X.lineWidth=1;X.strokeRect(JX,JY,JW,170);
    X.fillStyle='#c89030';X.font='bold 11px Share Tech Mono,monospace';X.textAlign='left';
    X.fillText('▶ JOURNAL ENTRY',JX+8,JY+16);
    X.strokeStyle='#6a3808';X.beginPath();X.moveTo(JX+8,JY+20);X.lineTo(JX+JW-8,JY+20);X.stroke();
    X.fillStyle='#a09060';X.font='9px Share Tech Mono,monospace';
    const words=player.journalText.split(' ');let line='',lineY=JY+33;
    for(const w of words){
      const test=line+w+' ';
      if(X.measureText(test).width>JW-18&&line!==''){X.fillText(line,JX+8,lineY);line=w+' ';lineY+=13;}
      else line=test;
    }
    if(line)X.fillText(line,JX+8,lineY);
    X.globalAlpha=1;
  }

  // Crosshair
  const css=4,csa=8;
  X.strokeStyle=`rgba(255,200,60,0.75)`;X.lineWidth=1.5;
  X.beginPath();
  X.moveTo(mouseX-csa,mouseY);X.lineTo(mouseX-css,mouseY);
  X.moveTo(mouseX+css,mouseY);X.lineTo(mouseX+csa,mouseY);
  X.moveTo(mouseX,mouseY-csa);X.lineTo(mouseX,mouseY-css);
  X.moveTo(mouseX,mouseY+css);X.lineTo(mouseX,mouseY+csa);
  X.stroke();
  X.strokeStyle='rgba(255,200,60,0.25)';X.beginPath();X.arc(mouseX,mouseY,5,0,Math.PI*2);X.stroke();
}

// ── MINIMAP ───────────────────────────────────────────────
function drawMinimap(){
  const MX=RW-158,MY=8,MW=145,MH=95;
  const sx=MW/MAPW,sy=MH/MAPH;
  X.fillStyle='rgba(0,0,0,0.82)';X.fillRect(MX-2,MY-2,MW+4,MH+4);
  X.strokeStyle='#6a4a08';X.lineWidth=1;X.strokeRect(MX-2,MY-2,MW+4,MH+4);

  for(let ty=0;ty<MAPH;ty++)for(let tx=0;tx<MAPW;tx++){
    if(!visited[ty][tx])continue;
    const t=map[ty][tx];if(t===T.VOID)continue;
    const px=(MX+tx*sx)|0,py=(MY+ty*sy)|0;
    const pw=Math.max(1,sx|0)||1,ph=Math.max(1,sy|0)||1;
    if(t===T.WALL)X.fillStyle='#2e2820';
    else if(t===T.EXIT)X.fillStyle='#00c870';
    else if(t===T.ENTRY)X.fillStyle='#2050e0';
    else if(t===T.HOT)X.fillStyle='#603010';
    else if(t===T.FLOOD)X.fillStyle='#102840';
    else if(t===T.DOOR)X.fillStyle='#806010';
    else X.fillStyle='#484038';
    X.fillRect(px,py,pw,ph);
  }

  // Enemies on minimap
  for(const e of enemies){
    if(e.dead)continue;
    const epx=(MX+e.wx/TILE*sx)|0,epy=(MY+e.wy/TILE*sy)|0;
    X.fillStyle=e.type==='GUARD'?'#4080c0':e.type==='WRAITH'?'#8070d0':'#806040';
    X.fillRect(epx-1,epy-1,3,3);
  }

  const ppx=(MX+player.wx/TILE*sx)|0,ppy=(MY+player.wy/TILE*sy)|0;
  X.fillStyle='#00d8ff';X.beginPath();X.arc(ppx,ppy,3,0,Math.PI*2);X.fill();
  X.strokeStyle='#00a0cc';X.lineWidth=1;X.stroke();
  X.fillStyle='rgba(100,80,40,0.5)';X.font='8px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText('MAP',MX+MW/2,MY+MH+10);
}

// ── TITLE / DEAD / WIN SCREENS ────────────────────────────
function drawTitle(){
  X.fillStyle='#030202';X.fillRect(0,0,RW,RH);
  // Stone-tile subtle bg
  for(let y=0;y<RH;y+=28)for(let x=0;x<RW;x+=36){
    const n=((x*7+y*3)%11)/11;X.fillStyle=`rgba(30,25,18,${0.3+n*0.3})`;X.fillRect(x,y,34,26);
    X.strokeStyle='rgba(0,0,0,0.6)';X.lineWidth=0.5;X.strokeRect(x,y,34,26);
  }
  // Rusty pipe horizontal
  X.fillStyle='#5a3010';X.fillRect(0,RH*0.16,RW,8);X.fillStyle='#7a4818';X.fillRect(0,RH*0.16+2,RW,3);
  X.fillStyle='#5a3010';X.fillRect(0,RH*0.82,RW,8);X.fillStyle='#7a4818';X.fillRect(0,RH*0.82+2,RW,3);
  // Pipe valves
  for(let vx=60;vx<RW;vx+=180){
    X.fillStyle='#8a4c20';X.beginPath();X.arc(vx,RH*0.16+4,12,0,Math.PI*2);X.fill();
    X.strokeStyle='#6a3410';X.lineWidth=2;X.stroke();
    X.fillStyle='#c07030';X.fillRect(vx-12,RH*0.16+2,24,4);
  }
  // Vignette
  const vg=X.createRadialGradient(RW/2,RH/2,100,RW/2,RH/2,RW*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.88)');
  X.fillStyle=vg;X.fillRect(0,0,RW,RH);
  // Steam particles (decorative)
  for(const s of steamClouds){
    const a=Math.min(0.3,s.life*0.5);X.globalAlpha=a;X.fillStyle='rgba(200,200,200,1)';X.beginPath();X.arc(s.wx,s.wy,s.r,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;
  // Title
  X.save();X.shadowColor='#c05010';X.shadowBlur=40;
  X.fillStyle='#e0a060';X.font='bold 90px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText('ABOVE HELL',RW/2,RH*0.38);
  X.fillText('BENEATH VT',RW/2,RH*0.51);
  X.restore();
  // Subtitle
  X.fillStyle='#8a6030';X.font='14px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText("Exploring Virginia Tech's Steam Tunnels and Beyond",RW/2,RH*0.53);
  // Controls
  X.fillStyle='rgba(140,110,50,0.7)';X.font='12px Share Tech Mono,monospace';
  X.fillText('WASD: MOVE  ·  MOUSE: AIM FLASHLIGHT  ·  CLICK/SPACE: ATTACK',RW/2,RH*0.60);
  X.fillText('Survive all 5 tunnel runs and reach the Power Plant',RW/2,RH*0.655);
  // Blink
  if(Math.floor(gtime*2)%2===0){
    X.fillStyle='#ffc840';X.font='bold 22px Share Tech Mono,monospace';X.textAlign='center';
    X.fillText('PRESS SPACE OR CLICK TO DESCEND',RW/2,RH*0.75);
  }
  // Warning
  X.fillStyle='rgba(180,80,20,0.6)';X.font='10px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText('⚠  THIS IS A GAME. DO NOT ENTER REAL STEAM TUNNELS.  ⚠',RW/2,RH*0.855);
  X.fillStyle='rgba(80,60,30,0.4)';X.font='10px Share Tech Mono,monospace';
  X.fillText('Based on beneathvt.com — Copyright © 2009-2021 Beneath VT. All rights reserved.',RW/2,RH-14);
  // Ambient steam
  if(Math.random()<0.015)steamClouds.push({wx:50+Math.random()*(RW-100),wy:RH,r:3,maxR:20+Math.random()*15,vx:(Math.random()-0.5)*8,vy:-25-Math.random()*20,life:1.2+Math.random()*0.8,alpha:0.6});
}

function drawDead(){
  X.fillStyle='rgba(0,0,0,0.88)';X.fillRect(0,0,RW,RH);
  X.save();X.shadowColor='#800000';X.shadowBlur=60;
  X.fillStyle='#aa0808';X.font='bold 88px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText('YOU DIED',RW/2,RH*0.42);
  X.restore();
  X.fillStyle='#806030';X.font='18px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText(`Run ${currentLevel+1}  ·  Kills: ${kills}  ·  Score: ${score}`,RW/2,RH*0.56);
  if(Math.floor(gtime*2)%2===0){X.fillStyle='#c09828';X.font='bold 20px Share Tech Mono,monospace';X.fillText('SPACE TO TRY AGAIN',RW/2,RH*0.70);}
  X.fillStyle='rgba(120,60,20,0.5)';X.font='11px Share Tech Mono,monospace';
  X.fillText('⚠  Do not enter real steam tunnels. This is a game.  ⚠',RW/2,RH-18);
}

function drawWin(){
  X.fillStyle='rgba(0,0,0,0.93)';X.fillRect(0,0,RW,RH);
  X.save();X.shadowColor='#a07000';X.shadowBlur=50;
  X.fillStyle='#e0b030';X.font='bold 56px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText('POWER PLANT',RW/2,RH*0.32);X.fillText('REACHED',RW/2,RH*0.44);
  X.restore();
  X.fillStyle='#a09040';X.font='italic 16px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText('"The tunnel near the power plant is ENORMOUS — could stand completely straight."',RW/2,RH*0.56);
  X.fillText('"Steam hiss was absolutely deafening." — Fuse, Beneath VT',RW/2,RH*0.62);
  X.fillStyle='#808030';X.font='18px Share Tech Mono,monospace';
  X.fillText(`Kills: ${kills}  ·  Score: ${score}  ·  Journals: ${player.journalCount||0}`,RW/2,RH*0.73);
  if(Math.floor(gtime*2)%2===0){X.fillStyle='#c0a028';X.font='bold 20px Share Tech Mono,monospace';X.fillText('SPACE TO PLAY AGAIN',RW/2,RH*0.84);}
}

function drawLevelUp(){
  X.fillStyle='rgba(0,0,0,0.82)';X.fillRect(0,0,RW,RH);
  const cx=RW/2,cy=RH/2;
  X.fillStyle='rgba(8,5,2,0.98)';X.fillRect(cx-230,cy-120,460,240);
  X.strokeStyle='#a07818';X.lineWidth=2;X.strokeRect(cx-230,cy-120,460,240);
  X.strokeStyle='#503808';X.lineWidth=1;X.strokeRect(cx-225,cy-115,450,230);
  X.fillStyle='#d0a030';X.font='bold 44px Share Tech Mono,monospace';X.textAlign='center';
  X.fillText('LEVEL UP',cx,cy-50);
  X.fillStyle='#c0a040';X.font='20px Share Tech Mono,monospace';
  X.fillText(`Now Level ${player.level}`,cx,cy-8);
  X.fillStyle='#907030';X.font='14px Share Tech Mono,monospace';
  X.fillText(`ATK +3  DEF +2  HP +18  BAT +15`,cx,cy+28);
  if(Math.floor(gtime*3)%2===0){X.fillStyle='#e0c050';X.font='bold 16px Share Tech Mono,monospace';X.fillText('PRESS SPACE TO CONTINUE',cx,cy+80);}
}

// ── GAME LOOP ─────────────────────────────────────────────
function loop(ts){
  requestAnimationFrame(loop);
  dt=Math.min((ts-lt)/1000,0.05);lt=ts;gtime+=dt;

  if(shake>0){shake-=dt*30;shakeX=(Math.random()-0.5)*shake*2;shakeY=(Math.random()-0.5)*shake*2;}
  else{shake=0;shakeX=0;shakeY=0;}
  if(comboTimer>0){comboTimer-=dt;if(comboTimer<=0)combo=0;}

  X.save();
  if(shake>0.2)X.translate(shakeX,shakeY);

  if(state===S.TITLE){drawTitle();X.restore();return;}
  if(state===S.DEAD){
    // Show frozen world underneath
    drawWorld();drawItems();drawSigns();drawEnemies();drawPlayer();drawParticles();
    drawLighting();drawMinimap();drawHUD();
    drawDead();X.restore();return;
  }
  if(state===S.WIN){drawWin();X.restore();return;}

  if(state===S.PLAY){
    handleMovement();updateEnemies();updateParticles();tryPickups();clampCam();
    if(player.atkTimer<=0&&player.state==='attack')player.state='idle';
    if(player.msgTimer>0)player.msgTimer-=dt;
    if(player.journalTimer>0)player.journalTimer-=dt;
  }

  drawWorld();drawItems();drawSigns();drawEnemies();drawPlayer();drawParticles();
  drawLighting();drawMinimap();drawHUD();

  if(state===S.LEVELUP){
    drawLevelUp();
    X.restore();
    return;
  }

  // Scanlines
  for(let y=0;y<RH;y+=3){X.fillStyle='rgba(0,0,0,0.04)';X.fillRect(0,y,RW,1);}

  X.restore();
}

requestAnimationFrame(loop);
</script>
