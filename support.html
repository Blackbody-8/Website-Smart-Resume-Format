    h1 { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 2rem; margin-bottom: 1.5rem; }
    h2 { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 1.15rem; margin-top: 2rem; margin-bottom: 0.5rem; padding-bottom: 6px; border-bottom: 2px solid var(--accent2); display: inline-block; }
    p { color: #44403c; margin-top: 0.75rem; }
    a { color: var(--accent2); }
    footer { text-align: center; padding: 2rem; background: #1c1917; color: #78716c; font-size: 0.88rem; margin-top: 4rem; }
